<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#f0eeea}</style></head><body>
<div id="hl-console-host"></div>
<script>
(function(){
  var DAY = 86400000, now = Date.now();
  // ?span=long stretches the confirmation dates past a year, so the 12-bucket cap
  // on the time chart is really exercised rather than assumed.
  var STEP = /[?&]span=long/.test(location.search) ? 20 : 9;
  var SUBS = ["pre-qualify","sign-otp","pay-deposit","transfer-attorneys","bond-approval","bond-approved"];
  var STATUS = ["confirmed","confirmed","confirmed","awaiting_payment","awaiting_clearance",
                "held","payment_failed","cancelled","refunded"];
  var PROPS = [{slug:"sanford-heart",name:"Sanford Heart",is_payfast_live:true},
               {slug:"polaris",name:"Polaris",is_payfast_live:true},
               {slug:"outeniqua",name:"Outeniqua",is_payfast_live:false},
               {slug:"stellenbosch",name:"Stellenbosch Village",is_payfast_live:false}];
  var items = [], i;
  for (i = 0; i < 30; i++) {
    var p = PROPS[i % 3];
    var due = (i % 7 === 0) ? now - 2*DAY          // overdue
            : (i % 7 === 1) ? now + 1.5*DAY        // <=3d
            : (i % 7 === 2) ? now + 5*DAY          // <=7d
            : (i % 7 === 3) ? now + 40*DAY         // further out
            : null;                                 // no deadline
    items.push({
      uuid: "u" + i,
      reference: "RES-" + p.slug.slice(0,3).toUpperCase() + "-" + String(i+1).padStart(3,"0"),
      first_name: "Buyer", last_name: String(i+1), email: "b"+i+"@example.co.za", phone: "",
      property_slug: p.slug, property_name: p.name, unit_name: "Unit " + (i+1),
      status: STATUS[i % STATUS.length],
      deal_stage: (i % 9 === 8) ? null : "reserve",
      deal_sub_stage: (i % 9 === 8) ? null : SUBS[i % 6],
      deal_stage_due_at: due,
      overdue: due !== null && due < now,
      days_left: due === null ? null : Math.round((due-now)/DAY),
      needs_attention: (i % 11 === 0),
      admin_notes: (i % 11 === 0) ? "Unit lost after payment" : "",
      payer_route: (i % 4 === 0) ? "cash" : (i % 4 === 1) ? "undecided" : "bond",
      reservation_fee_cents: 2500000,
      total_cents: 180000000 + (i * 3700000),
      // spread confirmations back over ~10 months; three rows never confirmed
      confirmed_at: (i % 10 === 9) ? null : now - (i * STEP * DAY),
      addon_count: 0, pf_payment_id: "pf" + i, has_member: true
    });
  }
  window.__FIXTURE = {
    staff: { name: "Anneke Grobler", role: "sales" },
    matched: items.length,
    summary: { total: items.length,
               overdue: items.filter(function(r){return r.overdue;}).length,
               needs_attention: items.filter(function(r){return r.needs_attention;}).length,
               by_status: { confirmed: 10, awaiting_payment: 4 },
               by_deal_stage: { reserve: 27 } },
    properties: PROPS,
    items: items
  };
  /* A model-native development: no Webflow ids, states recorded directly, and money
     that is not money yet. */
  (function () {
    var us = [], st, i;
    for (i = 1; i <= 12; i++) {
      st = (i <= 7) ? "available" : (i <= 9) ? "sold" : (i === 10) ? "held" : "unreleased";
      us.push({
        /* The row id delete_unit is addressed by. The real endpoint carries it on every row. */
        unit_id: 100 + i,
        unit_number: String(i), name: "Unit " + i, slug: "unit-" + i,
        /* THE UNIT POINTS AT A VARIANT, and the type is read THROUGH it - which is the
           shape of the real model, and the reason unit_variant_id is on the row at all. The
           earlier fixture named a Type C that no variant belonged to; a register test would
           have counted a home into a type nothing pointed at. */
        unit_variant_id: (i % 2 === 0) ? 21 : 11,
        type_code: (i % 2 === 0) ? "B" : "A",
        type_name: "Type " + ((i % 2 === 0) ? "B" : "A"),
        variant_code: (i % 2 === 0) ? "B1" : "A1",
        type_is_active: true, variant_is_active: true, orphan_variant: false,
        bedrooms: 3, bathrooms: 2, parking: 2,
        price_cents: 300000000 + i * 10000000,
        internal_area_sqm: (i % 3 === 0) ? null : 120 + i,
        erf_area_sqm: null,
        levy_monthly_cents: null, rates_monthly_cents: null,
        deposit_bond_pct: (i === 1) ? 10 : null, deposit_cash_pct: null,
        occupational_rental_pct: null,
        state: st, state_source: st === "available" ? "none" : "offer_state",
        is_available: st === "available",
        reservation: null,
        offer_state: st === "available" ? null : {
          state: st === "held" ? "reserved" : st,
          note: "Recorded directly — no reservation engine on this development.",
          source: "imported_sv", external_ref: null, updated_at: Date.now()
        },
        /* THE RAW BAG, and it must AGREE with field_values below. It used to say
           "North-facing" on all twelve while the resolved copy alternated, which made
           the fixture a claim no server could satisfy - and set_development_field reads
           the BAG when it works out whether a new option list would orphan values homes
           already carry, so the orphan refusal would have been graded against data the
           grid never showed. */
        attributes: { erf_number: 17500 + i,
                      aspect: (i % 2 === 0) ? "North-facing" : "East-facing" },
        /* Resolved by the server, whatever table each one actually came from. The grid reads
           only this - it never goes looking in attributes itself. */
        field_values: {
          aspect: (i % 2 === 0) ? "North-facing" : "East-facing",
          erf_number: 17500 + i,
          bedrooms: 3,
          view_tags: ["park", "mountain"]
        },
        phase_id: (i <= 6) ? 1 : 2,
        phase: (i <= 6)
          ? { id: 1, name: "Phase 1", code: "P1", is_released: true, sort_order: 0 }
          : { id: 2, name: "Phase 2", code: "P2", is_released: false, sort_order: 1 },
        wf_unit_id: null, source: "sv"
      });
    }
    /* THE CHAIN, APPLIED IN THE FIXTURE THE SAME WAY THE SERVER APPLIES IT: hold, then
       offer state, then phase. A home in the pending phase that nothing else has claimed
       becomes unreleased and says the phase answered. One that is already sold stays sold. */
    us.forEach(function (x) {
      if (x.state === "available" && x.phase && !x.phase.is_released) {
        x.state = "unreleased";
        x.state_source = "phase";
        x.is_available = false;
      }
    });
    /* THE TYPE AND VARIANT REGISTER, kept as its own object because the server keeps it in
       its own tables and its own endpoint. The inventory read derives its type and variant
       COUNTS from this rather than carrying its own, for the same reason the real one does:
       two numbers for one fact eventually disagree, and the panel-bar button is drawn from
       the grid read while the drawer is drawn from here. */
    /* POLARIS HAS ITS OWN REGISTER, because the real endpoints read the same tables and a
       fixture where /staff/inventory counts one type and /staff/types shows none would let a
       test pass over exactly the disagreement this model exists to remove. Its rows are
       cms-sourced, so they cannot be hard-deleted - the importer would write them back. */
    window.__TYP_CMS = {
      types: [
        { id: 5, code: "polaris-heart-b", name: "Polaris Heart B", description: "3 Bedrooms",
          display_order: 0, is_active: true, source: "cms", wf_item_id: "wf-t-b",
          variants: [
            { id: 51, code: "polaris-heart-b", name: null, is_default: true,
              bedrooms: 3, bathrooms: 3.5, parking: 2, internal_area_sqm: 176,
              patio_area_sqm: null, balcony_area_sqm: null, garage_area_sqm: null,
              total_area_sqm: null, price_from_cents: null, description: null,
              display_order: 0, is_active: true, source: "cms", stored_unit_count: null }
          ] }
      ]
    };

    /* THE REGISTER, IN ITS POST-MIGRATION SHAPE. THE FIGURES BELONG TO THE TYPE and a variant
       stores only what it changes. Before 6 Sep every variant carried a full set copied down
       from its type, which is why 512 of Stellenbosch's 544 resolved figures came off the
       variant level and a type change moved nothing. A fixture still seeded that way would
       let the console read the old flat columns and pass.

       DELIBERATE SHAPES HERE, each one exercising something:
         - A1 is the degenerate default and STORES NOTHING. This is the commonest row in the
           system and the one a naive console draws blank.
         - A2 genuinely overrides two figures, and ALSO restates bedrooms identically - the
           tidiness signal, which is a decision rather than a fault and must not be drawn as
           an error.
         - A1 still carries a legacy stored from-price. Nothing reads it; the figure shown is
           derived from the cheapest available home.
         - Type B records patio area as ZERO, which must inherit as 0 and never as unset -
           NULL means inherit, zero is a measurement. */
    window.__TYP_SV = {
      types: [
        { id: 1, code: "A", name: "Type A", description: "Two levels, three bedrooms.",
          display_order: 0, is_active: true, source: "native", wf_item_id: null,
          bedrooms: 3, bathrooms: 2.5, parking: 2, internal_area_sqm: 188,
          patio_area_sqm: 22, balcony_area_sqm: 13, garage_area_sqm: 45,
          total_area_sqm: 268,
          variants: [
            { id: 11, code: "A1", name: null, is_default: true,
              bedrooms: null, bathrooms: null, parking: null, internal_area_sqm: null,
              patio_area_sqm: null, balcony_area_sqm: null, garage_area_sqm: null,
              total_area_sqm: null, price_from_cents: 425000000, description: null,
              display_order: 0, is_active: true, source: "native", stored_unit_count: null },
            /* Its stored count is deliberately WRONG. The endpoint counts homes and returns
               the stored column beside it, so the drawer can say the two disagree - and a
               fixture that made them agree would never exercise that. */
            { id: 12, code: "A2", name: "Corner", is_default: false,
              bedrooms: 3, bathrooms: null, parking: null, internal_area_sqm: null,
              patio_area_sqm: 31, balcony_area_sqm: null, garage_area_sqm: null,
              total_area_sqm: 277, price_from_cents: null, description: null,
              display_order: 1, is_active: true, source: "native", stored_unit_count: 4 }
          ] },
        { id: 2, code: "B", name: "Type B", description: null,
          display_order: 1, is_active: true, source: "sv", wf_item_id: null,
          bedrooms: 2, bathrooms: 1.5, parking: 1, internal_area_sqm: 110,
          patio_area_sqm: 0, balcony_area_sqm: 12, garage_area_sqm: 43,
          total_area_sqm: 165,
          variants: [
            { id: 21, code: "B1", name: null, is_default: true,
              bedrooms: null, bathrooms: null, parking: null, internal_area_sqm: null,
              patio_area_sqm: null, balcony_area_sqm: null, garage_area_sqm: null,
              total_area_sqm: null, price_from_cents: null, description: null,
              display_order: 0, is_active: true, source: "sv", stored_unit_count: null }
          ] },
        /* A RETIRED TYPE, with its variant retired alongside it - the only shape the server
           allows, because an active variant under a retired type is the one combination
           /public/inventory cannot render. It holds no homes, so it can be removed for good. */
        { id: 3, code: "C", name: "Type C", description: null,
          display_order: 2, is_active: false, source: "native", wf_item_id: null,
          bedrooms: 4, bathrooms: 3.5, parking: 2, internal_area_sqm: 311,
          patio_area_sqm: 39, balcony_area_sqm: 14, garage_area_sqm: 46,
          total_area_sqm: 410,
          variants: [
            { id: 31, code: "C1", name: null, is_default: true,
              bedrooms: null, bathrooms: null, parking: null, internal_area_sqm: null,
              patio_area_sqm: null, balcony_area_sqm: null, garage_area_sqm: null,
              total_area_sqm: null, price_from_cents: null, description: null,
              display_order: 0, is_active: false, source: "native", stored_unit_count: null }
          ] }
      ]
    };

    window.__INV_SV = {
      property_slug: "stellenbosch", property_name: "Stellenbosch Village",
      inventory_source: "xano", prices_are_placeholder: true,
      /* THE DEVELOPMENT'S OWN COLUMNS, one from each source, because the whole point is
         that the grid cannot tell them apart. aspect is a key in the attributes bag and
         editable; erf_number is the same but a number; beds comes off the VARIANT and can
         never be edited from a unit row; view_tags is a list the grid can only show. */
      fields: [
        { field_key: "aspect", label: "Aspect", kind: "enum", source: "attribute",
          options: ["North-facing", "East-facing", "South-facing", "West-facing"],
          suffix: null, is_grid: true, is_public: true, is_filterable: true,
          is_editable: true, display_order: 5, help_text: "Which way the home faces.",
          filled: 12, of: 12 },
        { field_key: "erf_number", label: "Erf number", kind: "number", source: "attribute",
          options: null, suffix: null, is_grid: true, is_public: true, is_filterable: false,
          is_editable: true, display_order: 6, help_text: null, filled: 12, of: 12 },
        { field_key: "bedrooms", label: "Beds", kind: "number", source: "variant",
          options: null, suffix: null, is_grid: true, is_public: false, is_filterable: false,
          is_editable: false, display_order: 110,
          help_text: "Belongs to the type, so every home of that variant shares one.",
          filled: 12, of: 12 },
        { field_key: "view_tags", label: "View features", kind: "tags", source: "attribute",
          options: null, suffix: null, is_grid: false, is_public: true, is_filterable: true,
          is_editable: false, display_order: 30, help_text: null, filled: 12, of: 12 }
      ],
      phases_on: true, phase_visibility: "hidden",
      /* is_active mirrors the server: a retired phase is STILL RETURNED, flagged, because a
         home still in it has to be explainable. Only pickers filter. */
      phases: [
        { id: 1, name: "Phase 1", code: "P1", sort_order: 0, is_released: true,
          released_at: Date.now() - 86400000, note: "The lower terraces.",
          unit_count: 6, available: 6, is_active: true },
        { id: 2, name: "Phase 2", code: "P2", sort_order: 1, is_released: false,
          released_at: null, note: null, unit_count: 6, available: 0, is_active: true }
      ],
      units: us,
      /* RETIRED HOMES ride along in their own list, as the real endpoint returns them since
         10 Sep - out of the grid, out of the counts, visible only so restore can be offered. */
      retired: [],
      counts: { units: 12, types: 3, variants: 2, available: 7, held: 1, sold: 2,
                unreleased: 2, unavailable_other: 0, from_offer_state: 5, orphan_phase: 0 },
      setup: {
        unset_everywhere: ["internal_area_sqm", "erf_area_sqm", "deposit_bond_pct",
                           "deposit_cash_pct", "occupational_rental_pct",
                           "levy_monthly_cents", "rates_monthly_cents"],
        unset_on_some: [], is_complete: false
      },
      last_synced_at: Date.now(), server_time: Date.now()
    };

    /* A VARIANT-SOURCED ENUM, behind a switch rather than in the standing fixture. The panel
       shows an enum's allowed values but offers an editor only where the grid could actually
       write them, and the only way to grade that rule is against a field that is an enum AND
       belongs to the type. Added under a query param because a fifth standing field would
       move every count the other ten sections assert. */
    if (/[?&]varenum=1/.test(location.search)) {
      window.__INV_SV.fields.push({
        field_key: "finish_pack", label: "Finish pack", kind: "enum", source: "variant",
        options: ["Standard", "Premium"], suffix: null, is_grid: false, is_public: false,
        is_filterable: false, is_editable: false, display_order: 120,
        help_text: "Chosen when the type is built.", filled: 12, of: 12
      });
    }
  })();

  /* A CMS-backed development: real prices, and the one taken home is taken because a
     reservation holds it. */
  window.__INV_CMS = {
    property_slug: "polaris", property_name: "Polaris",
    inventory_source: "cms", prices_are_placeholder: false,
    phases_on: false, phase_visibility: "hidden", phases: [], fields: [],
    units: [
      { unit_number: "6", name: "Home 6", slug: "polaris-heart-06", type_code: "B",
        unit_variant_id: 51, type_is_active: true, variant_is_active: true,
        type_name: "Polaris Heart B", variant_code: "B", bedrooms: 3, bathrooms: 3.5,
        parking: 2, price_cents: 579500000, internal_area_sqm: 176.2, erf_area_sqm: 309.9,
        levy_monthly_cents: 396450, rates_monthly_cents: 271678, deposit_bond_pct: 10,
        deposit_cash_pct: 30, occupational_rental_pct: 0.7,
        state: "available", state_source: "none", is_available: true,
        reservation: null, offer_state: null, attributes: {},
        wf_unit_id: "wf-6", source: "cms" },
      { unit_number: "10", name: "Home 10", slug: "polaris-heart-10", type_code: "B",
        unit_variant_id: 51, type_is_active: true, variant_is_active: true,
        type_name: "Polaris Heart B", variant_code: "B", bedrooms: 3, bathrooms: 3.5,
        parking: 2, price_cents: 579500000, internal_area_sqm: 176.2, erf_area_sqm: 309.9,
        levy_monthly_cents: 396450, rates_monthly_cents: 271678, deposit_bond_pct: 10,
        deposit_cash_pct: 30, occupational_rental_pct: 0.7,
        state: "sold", state_source: "reservation", is_available: false,
        reservation: { reference: "RES-POL-001", uuid: "u0", status: "confirmed",
                       buyer_name: "Mabitsela Mawasha", deal_stage: "finance",
                       deal_sub_stage: "transfer-attorneys", deal_stage_due_at: null },
        offer_state: null, attributes: {}, wf_unit_id: "wf-10", source: "cms" }
    ],
    counts: { units: 2, types: 1, variants: 1, available: 1, held: 0, sold: 1,
              unreleased: 0, unavailable_other: 0, from_offer_state: 0 },
    setup: { unset_everywhere: [], unset_on_some: [], is_complete: true },
    last_synced_at: Date.now(), server_time: Date.now()
  };

  /* The module registry, matching what seed_feature_registry authors. Only the fields the
     console actually renders. */
  window.__FEAT_REGISTRY = [
    { key: "inventory", label: "Inventory", category: "Inventory", default: true,
      description: "The development's homes appear in the Inventory tab." },
    { key: "inventory_edit", label: "Record availability", category: "Inventory", default: false,
      description: "Staff may mark a home sold, reserved or unreleased. OFF by default." },
    { key: "inventory_fields", label: "Edit unit details", category: "Inventory", default: false,
      description: "Staff may edit prices, areas and deposit percentages in the grid. OFF by default." },
    { key: "manual_reservations", label: "Manual reservations", category: "Reservations", default: true,
      description: "Sales can type in a deal done in the show house." },
    { key: "portal", label: "Owners portal", category: "Portal", default: true,
      description: "Buyers are provisioned a portal login." }
  ];
  /* Decisions only. Absence means follow the default - the same sparse shape the real
     res_config rows have. */
  window.__FEAT_DECISIONS = { stellenbosch: { inventory_edit: true, inventory_fields: true } };

  /* The setting registry, matching what seed_setting_registry authors. A setting's decision
     is a typed VALUE rather than a boolean, which is the only thing that differs. */
  window.__SET_REGISTRY = [
    { key: "pricing_level", kind: "enum", label: "Where prices are set", category: "Inventory",
      default: "unit", options: ["unit", "type"],
      description: "unit - every home is priced individually. type - the price belongs to the variant." },
    { key: "media_level", kind: "enum", label: "Where floorplans and renders live",
      category: "Inventory", default: "type", options: ["type", "unit"],
      description: "type - one set of drawings per way of building. unit - each home has its own." },
    { key: "unit_pad", kind: "int", label: "Unit number width", category: "Inventory",
      default: 0, options: [],
      description: "How wide to write a unit number, zero-padded, when SHOWING it. 0 renders it as stored." },
    { key: "phase_visibility", kind: "enum", label: "Unreleased phases", category: "Phases",
      default: "hidden", options: ["hidden", "shown"],
      description: "hidden - homes in an unreleased phase do not appear publicly at all." }
  ];
  window.__SET_DECISIONS = { stellenbosch: { unit_pad: 2 } };
  /* res_properties as the console sees it. Stellenbosch is the native one; the rest are
     CMS-backed, so their tier-2 fields are refused per field by the property writer below. */
  window.__RECORDS = {
    "sanford-heart": { source: "cms", has_webflow_row: true, name: "Sanford Heart",
      hold_minutes: 30, sales_email: "sales@sanford.example", whatsapp_from: null, notify_webhook: null,
      reservation_fee_cents: 300000, is_selling: true, is_payfast_live: true, uses_new_flow: true,
      bond_rate: 11.75, bond_years: 20, bond_deposit_pct: 10 },
    polaris: { source: "cms", has_webflow_row: true, name: "Polaris",
      hold_minutes: 10, sales_email: null, whatsapp_from: null, notify_webhook: null,
      reservation_fee_cents: 300000, is_selling: true, is_payfast_live: true, uses_new_flow: false,
      bond_rate: 11.75, bond_years: 20, bond_deposit_pct: 10 },
    outeniqua: { source: "cms", has_webflow_row: true, name: "Outeniqua",
      hold_minutes: 10, sales_email: null, whatsapp_from: null, notify_webhook: null,
      reservation_fee_cents: 300000, is_selling: false, is_payfast_live: false, uses_new_flow: false,
      bond_rate: null, bond_years: null, bond_deposit_pct: null },
    stellenbosch: { source: "native", has_webflow_row: false, name: "Stellenbosch Village",
      hold_minutes: 30, sales_email: null, whatsapp_from: null, notify_webhook: null,
      reservation_fee_cents: null, is_selling: false, is_payfast_live: false, uses_new_flow: false,
      bond_rate: null, bond_years: null, bond_deposit_pct: null }
  };

  window.__resolveFeatures = function () {
    var devs = window.__FIXTURE.properties.map(function (p) {
      var own = window.__FEAT_DECISIONS[p.slug] || {};
      var features = {}, source = {}, on = 0;
      window.__FEAT_REGISTRY.forEach(function (m) {
        var has = Object.prototype.hasOwnProperty.call(own, m.key);
        var val = has ? own[m.key] : (m.default === true);
        features[m.key] = val;
        source[m.key] = has ? "set" : "default";
        if (val) { on++; }
      });
      /* Settings resolve exactly like modules - a decision, else the registry default - and
         carry their own source so the panel can tell "chosen" from "never had an opinion". */
      var sown = window.__SET_DECISIONS[p.slug] || {};
      var settings = {}, ssource = {};
      window.__SET_REGISTRY.forEach(function (x) {
        var shas = Object.prototype.hasOwnProperty.call(sown, x.key);
        settings[x.key] = shas ? sown[x.key] : x.default;
        ssource[x.key] = shas ? "set" : "default";
      });
      return {
        property_slug: p.slug, property_name: p.name, is_selling: !!p.is_payfast_live,
        /* THE RECORD - the third kind of per-development fact, carried since 10 Sep. */
        record: window.__RECORDS[p.slug] || null,
        features: features, source: source, on_count: on, of: window.__FEAT_REGISTRY.length,
        settings: settings, settings_source: ssource,
        display: {
          unit_pad: settings.unit_pad,
          pricing_level: settings.pricing_level,
          media_level: settings.media_level
        },
        unknown_keys: [], decision_count: Object.keys(own).length,
        settings_decided: Object.keys(sown).length
      };
    });
    return { registry: window.__FEAT_REGISTRY, setting_registry: window.__SET_REGISTRY,
             developments: devs, known_property: true,
             counts: { developments: devs.length, modules: window.__FEAT_REGISTRY.length,
                       settings: window.__SET_REGISTRY.length } };
  };

  window.__UNITS = [
    { wf_unit_id: "u-home-2", name: "Home 2", unit_number: "2", price_cents: 359500000,
      price_display: "R3,595,000", unit_size: "ERF Size: 272.34 m2", available: true, unavailable_reason: null },
    { wf_unit_id: "u-home-5", name: "Home 5", unit_number: "5", price_cents: 359500000,

          homes_cleared: (pd.release_homes === true) ? inPhase.length : 0,
          homes_on_market: onMarket, unit_count: inPhase.length
        }));
      } });
    }

    if (method === "POST" && u.indexOf("/staff/phases/release") !== -1) {
      window.__PH_POSTED = JSON.parse((opts && opts.body) || "{}");
      if (window.__PH_FAILS) {
        return Promise.resolve({ ok: false, status: 403, text: function () {
          return Promise.resolve('{"message":"Only a manager or an admin can release a phase."}');
        } });
      }
      var pr = window.__PH_POSTED;
      var body2 = window.__INV_SV;
      var hit = null;
      (body2.phases || []).forEach(function (x) {
        if (String(x.id) === String(pr.phase_id)) { hit = x; }
      });
      if (hit) {
        hit.is_released = (pr.released === true);
        if (hit.is_released && !hit.released_at) { hit.released_at = Date.now(); }
        body2.units.forEach(function (un) {
          if (String(un.phase_id) !== String(hit.id)) { return; }
          un.phase = { id: hit.id, name: hit.name, code: hit.code,
                       is_released: hit.is_released, sort_order: hit.sort_order };
          /* Re-derive, hold then offer state then phase. Only a home nothing else claimed
             moves - one recorded sold stays sold whichever way the phase goes. */
          if (un.reservation) { return; }
          if (un.offer_state) { return; }
          un.state = hit.is_released ? "available" : "unreleased";
          un.state_source = hit.is_released ? "none" : "phase";
          un.is_available = hit.is_released;
        });
      }
      return Promise.resolve({ ok: true, status: 200, text: function () {
        return Promise.resolve(JSON.stringify({ phase_id: pr.phase_id,
          released: !!(hit && hit.is_released), units: hit ? hit.unit_count : 0 }));
      } });
    }

    if (method === "POST" && u.indexOf("/staff/phases") !== -1) {
      window.__PH_POSTED = JSON.parse((opts && opts.body) || "{}");
      if (window.__PH_FAILS) {
        return Promise.resolve({ ok: false, status: 403, text: function () {
          return Promise.resolve('{"message":"Only a manager or an admin can change a development\'s phases."}');
        } });
      }
      var np = window.__PH_POSTED;
      var sv = window.__INV_SV;
      sv.phases = sv.phases || [];

      /* AN EDIT, not a create - which is how a retired phase comes back. is_active is
         nullable all the way down: omitted keeps what the row has. */
      if (np.phase_id) {
        var edit = null;
        sv.phases.forEach(function (x) { if (String(x.id) === String(np.phase_id)) { edit = x; } });
        if (!edit) {
          return Promise.resolve({ ok: false, status: 400, text: function () {
            return Promise.resolve('{"message":"That phase belongs to another development."}');
          } });
        }
        ["name", "code", "note"].forEach(function (k) {
          if (Object.prototype.hasOwnProperty.call(np, k)) { edit[k] = np[k]; }
        });
        if (Object.prototype.hasOwnProperty.call(np, "is_active")) {
          edit.is_active = np.is_active !== false;
        }
        return Promise.resolve({ ok: true, status: 200, text: function () {
          return Promise.resolve(JSON.stringify({
            phase_id: edit.id, created: false, name: edit.name,
            is_active: edit.is_active !== false
          }));
        } });
      }

      /* A RETIRED phase never blocks a name, matching the server - two live phases called
         "Phase 2" is the mistake worth refusing; a retired one is not in the way. */
      var dup = false;
      sv.phases.forEach(function (x) {
        if (x.is_active === false) { return; }
        if (String(x.name).toLowerCase() === String(np.name || "").toLowerCase()) { dup = true; }
      });
      if (dup) {
        return Promise.resolve({ ok: false, status: 400, text: function () {
          return Promise.resolve('{"message":"A phase of that name already exists here."}');
        } });
      }
      var maxId = 0, maxSort = -1;
      sv.phases.forEach(function (x) {
        if (x.id > maxId) { maxId = x.id; }
        if (x.sort_order > maxSort) { maxSort = x.sort_order; }
      });
      sv.phases.push({ id: maxId + 1, name: np.name, code: np.code || null,
        sort_order: maxSort + 1, is_released: false, released_at: null,
        note: np.note || null, unit_count: 0, available: 0, is_active: true });
      return Promise.resolve({ ok: true, status: 200, text: function () {
        return Promise.resolve(JSON.stringify({ phase_id: maxId + 1, created: true }));
      } });
    }

    if (method === "POST" && u.indexOf("/staff/units/phase") !== -1) {
      window.__PHMOVE_POSTED = JSON.parse((opts && opts.body) || "{}");
      var mv = window.__PHMOVE_POSTED;
      var sv2 = window.__INV_SV;
      var byNum = {};
      sv2.units.forEach(function (x) { byNum[String(Number(x.unit_number))] = x; });
      var missing = [];
      (mv.unit_numbers || []).forEach(function (nn) {
        if (!byNum[String(Number(nn))]) { missing.push(nn); }
      });
      if (missing.length) {
        return Promise.resolve({ ok: false, status: 400, text: function () {
          return Promise.resolve('{"message":"Some of those unit numbers are not in this development, so nothing was changed."}');
        } });
      }
      var target = null;
      if (mv.phase_id) {
        (sv2.phases || []).forEach(function (x) {
          if (String(x.id) === String(mv.phase_id)) { target = x; }
        });
      }
      (mv.unit_numbers || []).forEach(function (nn) {
        var un2 = byNum[String(Number(nn))];
        un2.phase_id = target ? target.id : null;
        un2.phase = target ? { id: target.id, name: target.name, code: target.code,
                               is_released: target.is_released, sort_order: target.sort_order }
                           : null;
        if (un2.reservation || un2.offer_state) { return; }
        var pending2 = target && !target.is_released;
        un2.state = pending2 ? "unreleased" : "available";
        un2.state_source = pending2 ? "phase" : "none";
        un2.is_available = !pending2;
      });
      return Promise.resolve({ ok: true, status: 200, text: function () {
        return Promise.resolve(JSON.stringify({ counts: { matched: (mv.unit_numbers || []).length } }));
      } });
    }

    /* A HOME'S LIFE - create_unit and delete_unit, mirroring the server's refusals so the
       console is graded against the answers it will actually get. Both record what was posted. */
    if (method === "POST" && u.indexOf("/staff/units/delete") !== -1) {
      var db = JSON.parse((opts && opts.body) || "{}");
      window.__UNIT_DEL_POSTED = db;
      if (window.__UNIT_DEL_FAILS) {
        return typRefuse(String(window.__UNIT_DEL_FAILS));
      }
      var sv = window.__INV_SV;
      var hardD = db.hard === true, restoreD = db.restore === true;
      if (hardD && restoreD) { return typRefuse("hard and restore are opposites - pass one or the other."); }
      var live = null, liveIx = -1, ret = null, retIx = -1;
      sv.units.forEach(function (x, ix) { if (Number(x.unit_id) === Number(db.unit_id)) { live = x; liveIx = ix; } });
      (sv.retired || []).forEach(function (x, ix) { if (Number(x.unit_id) === Number(db.unit_id)) { ret = x; retIx = ix; } });
      if (!live && !ret) {
        return Promise.resolve({ ok: false, status: 404, text: function () {
          return Promise.resolve('{"message":"No home with that id."}'); } });
      }
      if (hardD) {
        var victim = live || ret;
        if (String(victim.source || "native") !== "native") {
          return typRefuse("This home came from an importer, so removing the row does not remove the home. Retire it instead.");
        }
        if (live) { sv.units.splice(liveIx, 1); } else { sv.retired.splice(retIx, 1); }
        return typOk({ unit_id: db.unit_id, removed: 1, restored: 0 });
      }
      if (restoreD) {
        if (ret) {
          sv.retired.splice(retIx, 1);
          sv.units.push(ret.__row);
        }
        return typOk({ unit_id: db.unit_id, removed: 0, restored: 1, was_retired: ret ? 1 : 0 });
      }
      if (live) {
        sv.units.splice(liveIx, 1);
        sv.retired.push({ unit_id: live.unit_id, unit_number: live.unit_number, name: live.name,
          key: "stellenbosch:" + live.unit_number, unit_variant_id: live.unit_variant_id,
          variant_code: live.variant_code, type_code: live.type_code, source: live.source,
          wf_unit_id: live.wf_unit_id, __row: live });
      }
      return typOk({ unit_id: db.unit_id, removed: 0, restored: 0, was_retired: live ? 0 : 1 });
    }
    if (method === "POST" && /\/staff\/units(\?|$)/.test(u)) {
      var cb = JSON.parse((opts && opts.body) || "{}");
      window.__UNIT_POSTED = cb;
      if (window.__UNIT_FAILS) { return typRefuse(String(window.__UNIT_FAILS)); }
      if (cb.property_slug !== "stellenbosch") {
        return typRefuse("This development's inventory still comes from the Webflow CMS, so its homes here are a nightly shadow of it.");
      }
      var num = String(cb.unit_number || "").trim();
      if (!num) { return typRefuse("A home needs a number."); }
      if (num.length > 1 && num.charAt(0) === "0") { return typRefuse("Unit numbers are stored plain, so use the number without its leading zero."); }
      var cv = null, ct = null;
      (typReg("stellenbosch").types || []).forEach(function (t) {
        (t.variants || []).forEach(function (v) { if (v.code === cb.variant_code && v.is_active !== false) { cv = v; ct = t; } });
      });
      if (!cv) {
        return Promise.resolve({ ok: false, status: 404, text: function () {
          return Promise.resolve('{"message":"No variant with that code on this development."}'); } });
      }
      var takenLive = window.__INV_SV.units.some(function (x) { return x.unit_number === num; });
      var takenRet = (window.__INV_SV.retired || []).some(function (x) { return x.unit_number === num; });
      if (takenRet) { return typRefuse("A retired home already has that number on this development. Restore that home rather than creating a second one."); }
      if (takenLive) { return typRefuse("A home with that number already exists on this development."); }
      var nm = cb.name || ("Home " + num);
      var made = null;
      if (cb.dry_run !== true) {
        window.__UNIT_SEQ = (window.__UNIT_SEQ || 200) + 1;
        made = window.__UNIT_SEQ;
        window.__INV_SV.units.push({
          unit_id: made, unit_number: num, name: nm, slug: null,
          unit_variant_id: cv.id, type_code: ct.code, type_name: ct.name, variant_code: cv.code,
          type_is_active: true, variant_is_active: true, orphan_variant: false,
          bedrooms: null, bathrooms: null, parking: null, price_cents: null,
          internal_area_sqm: null, erf_area_sqm: null, levy_monthly_cents: null, rates_monthly_cents: null,
          deposit_bond_pct: null, deposit_cash_pct: null, occupational_rental_pct: null,
          state: "available", state_source: "none", is_available: true,
          reservation: null, offer_state: null, attributes: {}, field_values: {},
          phase_id: null, phase: null, wf_unit_id: null, source: "native"
        });
      }
      return typOk({ property_slug: "stellenbosch", property_name: "Stellenbosch Village",
        unit_number: num, key: "stellenbosch:" + num, name: nm,
        variant_code: cv.code, variant_id: cv.id, unit_type_id: ct.id,
        unit_id: made, source: "native", dry_run: cb.dry_run === true ? true : null });
    }

    if (u.indexOf("/staff/units") !== -1) {
      return Promise.resolve({ ok: true, status: 200, text: function () {
        return Promise.resolve(JSON.stringify({
          property: "sanford", property_name: "Sanford Heart",
          fee_cents: 300000, is_selling: false,
          units: window.__UNITS, available: window.__UNITS.length, truncated: false
        }));
      } });
    }

    if (method === "POST" && u.indexOf("/staff/reservations") !== -1 &&
        u.indexOf("/staff/reservations/") === -1) {
      window.__POSTED = JSON.parse((opts && opts.body) || "{}");
      if (window.__CREATE_FAILS) {
        return Promise.resolve({ ok: false, status: 400, text: function () {
          return Promise.resolve('{"message":"That home is already held by another reservation."}');
        } });
      }
      var made = {
        uuid: "u0", reference: "RES-SAN-031", status: "confirmed",
        property_slug: window.__POSTED.property_slug, unit: "Home 5",
        payer_route: window.__POSTED.payer_route, reservation_fee_cents: 300000,
        deal_stage: "finance", deal_sub_stage: "sign-otp",
        otp_generated: !!window.__POSTED.generate_otp,
        cms_written: !/[?&]cmsfail=1/.test(location.search), cms_owner: "xano",
        provisioning: { outcome: "created" }
      };
      return Promise.resolve({ ok: true, status: 200,
        text: function () { return Promise.resolve(JSON.stringify(made)); } });
    }

    if (u.indexOf("/staff/reservations") !== -1 && u.indexOf("/staff/reservations/") === -1) {
      // ?slow=N holds the response open so the boot screen can be observed; ?fail=1
      // makes it error, so the boot screen can be shown to clear on failure too.
      var slow = (/[?&]slow=(\d+)/.exec(location.search) || [0, 0])[1] | 0;
      // TWO DIFFERENT 403s, AND THE CONSOLE MUST TELL THEM APART.
      // ?expired=1 is Xano's REAL answer to an expired staff token, copied verbatim:
      // ACCESS DENIED with that exact sentence, and NOT a 401. A stub that returned 401
      // here would prove the old code worked rather than the new code.
      // ?refuse=1 is the other kind - a refusal this console means and the person must
      // READ. Without it nothing would object to signing out on every 403, which would
      // be the worse bug: throwing somebody to a login screen to tell them they lack a
      // permission they will still lack.
      // Both anchored on [?&] - trap: "fail=1" is a substring of "cmsfail=1".
      var res = /[?&]expired=1/.test(location.search)
        ? { ok: false, status: 403, text: function () {
            return Promise.resolve('{"code":"ERROR_CODE_ACCESS_DENIED","message":"This token is expired."}'); } }
        : /[?&]refuse=1/.test(location.search)
        ? { ok: false, status: 403, text: function () {
            return Promise.resolve('{"code":"ERROR_CODE_ACCESS_DENIED","message":"Your role cannot see other people\u2019s pipeline."}'); } }
        : /[?&]fail=1/.test(location.search)
        ? { ok: false, status: 500, text: function () { return Promise.resolve('{"message":"boom"}'); } }
        : { ok: true, status: 200,
            text: function () { return Promise.resolve(JSON.stringify(window.__FIXTURE)); } };
      return new Promise(function (r) { setTimeout(function () { r(res); }, slow); });
    }
    if (u.indexOf("/staff/") !== -1) {
      return Promise.resolve({ ok: true, status: 200,
        text: function () { return Promise.resolve("{}"); } });
    }
    return realFetch.apply(window, arguments);
  };
  // ?prefont=1 puts the stylesheet on the page already, the way a hand-pasted head
  // snippet would, so the console's "inject once" guard is actually exercised.
  if (/[?&]prefont=1/.test(location.search)) {
    var pf = document.createElement("link");
    pf.id = "hl-console-font"; pf.rel = "stylesheet";
    pf.href = "https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap";
    document.head.appendChild(pf);
  }
  try {
    sessionStorage.setItem("hl_staff_token", "test-token");
    sessionStorage.setItem("hl_staff_who", JSON.stringify({ name: "Anneke Grobler", role: window.__ROLE }));
  } catch (e) {}
}());
</script>
