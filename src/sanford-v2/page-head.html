     writes the @font-face rules into the site stylesheet. These three preloads pull the
     faces that paint first - the loader wordmark, the hero display line, body copy - so
     they are already in flight while that stylesheet is still being parsed. -->

<link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdn.prod.website-files.com/61110f294933f9d0faf6d77f/6a2985a0b9c89b7ba97ce32c_Righteous-Regular.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://webflow-files-prod.global.ssl.fastly.net/61110f294933f9d0faf6d77f/fonts/6aab8a93e7878c50f4fd8d11-Newsreader-ExtraLight.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://webflow-files-prod.global.ssl.fastly.net/61110f294933f9d0faf6d77f/fonts/6aab8a92fbccf47717872c7c-Manrope-Regular.woff2">

<link rel="preload" as="image" fetchpriority="high" href="https://cdn.prod.website-files.com/61110f294933f9d0faf6d77f/6aaaaaccb498ff08c62f988c_sd2-hero-poster-9x16.jpg" media="(max-width: 767px)">
<!-- Memberstack (the Heartland app) - the pre-launch waitlist is a passwordless sign-up onto the
     Sanford Heart plan. Deferred: nothing on this page needs it before first paint, and the
     bundle waits for window.$memberstackDom. webflow.io domains run in Memberstack's SANDBOX
     mode, so staging sign-ups never touch live members. -->
<script data-memberstack-app="app_cmmoyq2ln006j0ssyfcttbd9q" src="https://static.memberstack.com/scripts/v2/memberstack.js" type="text/javascript" defer></script>
<script>
  (function (h) {
    h.classList.add('sd2-js');
    // The loader is two pseudo-elements on <html> (see .sd2-loading below), so there is no
    // markup to inject and nothing to wait for: it is painted with the first frame.
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { return; }
    h.classList.add('sd2-loading');
    var start = Date.now(), done = false;
    function lift() {
      if (done) { return; }
      done = true;
      // Hold it just long enough to read, never long enough to annoy.
      setTimeout(function () {
        h.classList.add('sd2-loaded');
        setTimeout(function () { h.classList.remove('sd2-loading', 'sd2-loaded'); }, 700);
      }, Math.max(0, 620 - (Date.now() - start)));
    }
    addEventListener('load', lift);
    setTimeout(lift, 2600);            // a stalled asset must never trap the page
  })(document.documentElement);
</script>
<style>
  html{scroll-behavior:smooth;scroll-padding-top:5rem}
  @media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
  .sd2_page{-webkit-font-smoothing:antialiased;text-wrap:pretty}
  .sd2_page ::selection{background:#E2D5C6}

  /* reveals — hidden only when JS is running, so nothing disappears without it */
  html.sd2-js .sd2_reveal{transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
  html.sd2-js .sd2_reveal:not(.is-inview){opacity:0;transform:translateY(26px)}

  /* JS state classes. These live here, not as Webflow combo classes: a combo class that no
     element carries in the Designer is published by Webflow as a BARE selector (.is-active{…})
     and leaks onto every other page of the site. Everything below is toggled by the bundle. */
  .sd2_nav.is-scrolled{border-bottom:1px solid rgba(28,26,23,.08);background-color:rgba(246,243,238,.86);background-image:none;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#1C1A17}
  .sd2_life_cap.is-on{opacity:1;pointer-events:auto;transform:translateY(0)}
  .sd2_life_dot.is-current{width:3.5rem;color:#FCFAF7}
  .sd2_hero_video.is-playing,.sd2_fly_video.is-playing{opacity:1}
  .sd2_map_overlay.is-on{opacity:.85}
  .sd2_pin.is-reserved{border-color:#A9754B;background-color:#C79A6E;color:#1C1A17;cursor:not-allowed}
  .sd2_pin.is-sold{border-color:#8C382D;background-color:#B54A3E;color:#FCFAF7;text-decoration:line-through;cursor:not-allowed}
  .sd2_pin.is-active{z-index:5;width:2.5rem;height:2.5rem;border-color:#A9754B;background-color:#A9754B;box-shadow:0 0 0 7px rgba(169,117,75,.18),0 10px 26px rgba(28,26,23,.3);color:#FCFAF7;font-size:.8125rem}
  .sd2_pin.is-dim{opacity:.28}
  .sd2_aerial_map.is-open{display:block}
  .sd2_up_panel.is-open{flex:1 1 0;background-color:#F6F3EE}
  .sd2_option.is-active{border-color:#1C1A17;background-color:#FCFAF7}
  .sd2_calc_backdrop.is-open{opacity:1;pointer-events:auto}
  .sd2_bar.is-visible{opacity:1;pointer-events:auto;transform:translateY(0)}
  .sd2_vr_tab.is-active{border-color:#F6F3EE;background-color:#F6F3EE;color:#1C1A17}

  /* page loader — a cream sheet, the wordmark, and one hairline that fills.
     Drawn entirely with ::before/::after so it needs no markup and no bundle. */
  html.sd2-loading,html.sd2-loading body{overflow:hidden}
  html.sd2-loading::before,html.sd2-loading::after{position:fixed;z-index:9999;pointer-events:none}
  html.sd2-loading::before{
    content:"SANFORD HEART";inset:0;display:flex;align-items:center;justify-content:center;
    padding-bottom:3rem;background:#F6F3EE;color:#1C1A17;
    font-family:Righteous,Manrope,sans-serif;font-size:.8125rem;
    letter-spacing:.42em;text-indent:.42em;white-space:nowrap}
  html.sd2-loading::after{
    content:"";left:50%;top:50%;margin-top:.5rem;transform:translateX(-50%);
    width:8.75rem;height:1px;background-color:rgba(28,26,23,.14);
    background-image:linear-gradient(90deg,#A9754B,#C79A6E);
    background-repeat:no-repeat;background-size:0% 100%;
    animation:sd2-load 1.5s cubic-bezier(.25,.8,.3,1) forwards}
  @keyframes sd2-load{to{background-size:100% 100%}}
  html.sd2-loaded::before,html.sd2-loaded::after{opacity:0;transition:opacity .55s ease}
  html.sd2-loaded::after{background-size:100% 100%}

  /* nav */
  .sd2_nav.is-scrolled .sd2_nav_cta{background:#1C1A17;color:#F6F3EE;border-color:transparent}
  .sd2_nav.is-scrolled .sd2_nav_cta:hover{background:#A9754B;color:#FCFAF7}

  /* life scroller — multi-property transitions */
  .sd2_life_slide{transition:opacity 1.1s cubic-bezier(.2,.7,.2,1),transform 6s ease-out;will-change:transform,opacity}
  .sd2_life_cap{transition:opacity .8s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
  .sd2_life_dot.is-current .sd2_life_dot_label{opacity:1}
  .sd2_life_hint{writing-mode:vertical-rl}
  /* the sticky panel must never be taller than the VISIBLE viewport: on iOS 100vh includes the
     collapsed toolbar area, which pushes the caption under Safari's bottom bar. svh is the small
     viewport; browsers without it keep the 100vh from the class. */
  .sd2_life_sticky{height:100svh}
  .sd2_life_ui{padding-bottom:env(safe-area-inset-bottom)}
  /* One slide per swipe on phones. The bands are invisible boxes the page can snap to —
     one per picture — added by the bundle only under 768px. Proximity, not mandatory, so
     the rest of the page still scrolls freely; the negative scroll-margin cancels the
     5rem scroll-padding so a snapped slide sits flush against the top. */
  @media screen and (max-width: 767px){
    html.sd2-js{scroll-snap-type:y proximity}
    .sd2_life_snaps{position:absolute;inset:0;pointer-events:none}
    .sd2_life_snap{position:absolute;left:0;right:0;scroll-snap-align:start;scroll-margin-top:-5rem}
  }

  /* masterplan: on phones the frame is a square window that pans in both directions over a
     drawing twice its width (.sd2_map_pan). Webflow owns the sizes; these are the bits its
     panel cannot express. The drawing and the pin layer share that box, so they zoom together
     and the pins stay put — which is why nothing here scales anything.
     The two axes want opposite overscroll rules. Vertically it must CHAIN: a swipe pans the
     drawing to its bottom edge and then keeps going as an ordinary page scroll, otherwise the
     page reads as frozen for the ~100px the map has left in it. Horizontally it must be
     CONTAINED, so panning past the left or right edge cannot trigger the browser's
     back-navigation swipe. */
  .sd2_map_frame{scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;overscroll-behavior-y:auto}
  .sd2_map_frame::-webkit-scrollbar{display:none}

  @media screen and (max-width: 767px){
    .sd2_life{height:480vh}
    /* six full-screen composited layers with a 6s scale is what makes phones drop frames / flash
       black panels — on small screens the slides just cross-fade */
    .sd2_life_slide{transform:none;transition:opacity .75s ease;will-change:auto}
    .sd2_life_caps{min-height:0}
  }

  /* lighting toggle */
  .sd2_light_tab_bg{transition:transform 380ms cubic-bezier(.4,0,.2,1),opacity 260ms cubic-bezier(.4,0,.2,1)}
  .sd2_light_tab.is-active .sd2_light_tab_bg{transform:scale(1);opacity:1}
  .sd2_light.is-auto .sd2_light_tab.is-active .sd2_light_tab_progress{animation:sd2-lt-progress var(--lt-dwell,4200ms) linear forwards}
  @keyframes sd2-lt-progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .sd2_light_tab:focus-visible{outline:2px solid #fff;outline-offset:3px}

  /* availability selector */
  @keyframes sd2-pulse{0%{transform:scale(1);opacity:.55}70%{transform:scale(2.1);opacity:0}100%{transform:scale(2.1);opacity:0}}
  .sd2_pin_ring{animation:sd2-pulse 2.6s ease-out infinite}
  .sd2_pin.is-reserved .sd2_pin_ring,.sd2_pin.is-sold .sd2_pin_ring,.sd2_pin.is-active .sd2_pin_ring{display:none}
  .sd2_pin.is-hover{width:2.5rem;height:2.5rem;font-size:.8125rem;box-shadow:0 6px 18px rgba(28,26,23,.25);z-index:4}
  .sd2_pin_tag,.sd2_pin_tag_sold{display:none}
  .sd2_pin.is-reserved .sd2_pin_tag[data-flag=reserved],
  .sd2_pin.is-sold .sd2_pin_tag_sold[data-flag=sold]{display:block}
  .sd2_strip,.sd2_apps,.sd2_gallery_track{scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .sd2_strip::-webkit-scrollbar,.sd2_apps::-webkit-scrollbar,.sd2_gallery_track::-webkit-scrollbar{display:none}
  .sd2_gallery_track,.sd2_apps{scroll-snap-type:x mandatory}
  .sd2_gallery_item,.sd2_app{scroll-snap-align:start}
  .sd2_sizes{white-space:pre-line}
  .sd2_detail_assets{display:none}

  /* make it yours — closed tabs read vertically on desktop */
  @media (min-width: 992px){
    .sd2_up_panel:not(.is-open) .sd2_up_title{writing-mode:vertical-rl;transform:rotate(180deg);margin-top:6px}
    .sd2_up_panel{transition:flex-grow .55s cubic-bezier(.2,.7,.2,1),flex-basis .55s cubic-bezier(.2,.7,.2,1),background-color .4s ease}
  }
  .sd2_option.is-active .sd2_option_swatch{box-shadow:inset 0 0 0 2px #FCFAF7,0 0 0 1px #1C1A17}

  /* aerial pin */
  .sd2_aerial_pin_body{clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);border-radius:74px 74px 90px 90px / 74px 74px 90px 90px}
  .sd2_map_iframe,.sd2_vr_iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
  .sd2_loc_map .sd2_map_iframe{filter:saturate(.55) sepia(.18) brightness(1.02) contrast(.95)}

  /* explore more — collapsed until asked (only when JS runs) */
  html.sd2-js .sd2_explore:not(.is-open){display:none}
  /* Opacity only, no translate: the browser jumps to #sd2-explore the moment this block is

  @keyframes sd2-fade-in{from{opacity:0}to{opacity:1}}
  .sd2_explore.is-open{animation:sd2-fade-in .7s ease both}

  /* bond calculator */
  .sd2_range{accent-color:#A9754B}
  .sd2_calc{transition:transform .45s cubic-bezier(.2,.7,.2,1)}
  .sd2_calc.is-open{transform:none}
  .sd2_calc_field_val .sd2_calc_sub_item{color:#1C1A17}
  .sd2_calc_backdrop{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  html.sd2-calc-open{overflow:hidden}

  /* sticky bar + upgrade tags */
  .sd2_bar{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .sd2_option_tags:has(.sd2_option_tag_std:not(.w-condition-invisible)) .sd2_option_tag{display:none}

  /* ---------------- pre-launch (html.sd2-prelaunch is set by the bundle from data-sd2-phase) */
  html:not(.sd2-prelaunch) .sd2_gate,html:not(.sd2-prelaunch) .sd2_countdown{display:none}
  /* The availability selector and every price stay blurred until you're on the waitlist.
     Presentation, not security: the source still carries the from-price. */
  .sd2_select_grid{position:relative}
  html.sd2-prelaunch .sd2_select_grid > :not(.sd2_gate),html.sd2-prelaunch #sd2-select .sd2_filters,html.sd2-prelaunch #sd2-select .sd2_legend{transition:filter .7s cubic-bezier(.2,.7,.2,1)}
  html.sd2-prelaunch:not(.sd2-member) .sd2_select_grid > :not(.sd2_gate),
  html.sd2-prelaunch:not(.sd2-member) #sd2-select .sd2_filters,
  html.sd2-prelaunch:not(.sd2-member) #sd2-select .sd2_legend{filter:blur(16px) saturate(.8);pointer-events:none;user-select:none}
  /* Prices are not blurred: the value collapses to nothing and a prompt takes its place.

  html.sd2-prelaunch:not(.sd2-member) [data-sd2-price]{font-size:0 !important;letter-spacing:0 !important;cursor:pointer;user-select:none}
  html.sd2-prelaunch:not(.sd2-member) [data-sd2-price]::after{content:"Join waitlist to see pricing";display:inline-block;font-family:Manrope,sans-serif;font-size:.8125rem;font-weight:500;line-height:1.4;letter-spacing:.01em;text-transform:none;font-style:normal;color:inherit;text-decoration:underline;text-decoration-color:#C79A6E;text-decoration-thickness:1px;text-underline-offset:4px;transition:text-decoration-color .25s ease}
  html.sd2-prelaunch:not(.sd2-member) [data-sd2-price]:hover::after{text-decoration-color:currentColor}
  html.sd2-prelaunch:not(.sd2-member) [data-sd2-price=derived]::after{content:"—";font-size:1rem;text-decoration:none;opacity:.45}
  html.sd2-prelaunch:not(.sd2-member) .sd2_fin_note[data-sd2-price]::after{content:"Join waitlist to see pricing and repayments"}
  html.sd2-member .sd2_gate{display:none}
  .sd2_gate_card{-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%)}
  html:not(.sd2-auth-known) .sd2_gate_card{opacity:.001}
  .sd2_gate_card{transition:opacity .5s ease}
  .sd2_countdown_cell{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .sd2_countdown_num{font-variant-numeric:tabular-nums}
  html.sd2-launched .sd2_countdown_grid{display:none}

  /* sign-up dialog */
  .sd2_auth.is-open{display:flex;animation:sd2-fade-in .35s ease both}
  .sd2_auth.is-open .sd2_auth_panel{animation:sd2-rise .45s cubic-bezier(.2,.7,.2,1) both}
  @keyframes sd2-rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  html.sd2-auth-open,html.sd2-auth-open body{overflow:hidden}
  .sd2_auth_backdrop{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .sd2_auth_input:focus{border-color:#A9754B;outline:none;box-shadow:0 0 0 3px rgba(169,117,75,.15)}
  .sd2_auth_input::placeholder{color:rgba(28,26,23,.4)}
  .sd2_auth_submit:disabled{opacity:.6;cursor:progress}
  .sd2_auth_close:focus-visible,.sd2_auth_submit:focus-visible{outline:2px solid #A9754B;outline-offset:3px}

  /* points of interest modal (section 06 "See All Points of Interest") */
  .sd2_poi.is-open{display:flex;animation:sd2-fade-in .3s ease both}
  .sd2_poi.is-open .sd2_poi_panel{animation:sd2-rise .45s cubic-bezier(.2,.7,.2,1) both}
  html.sd2-poi-open,html.sd2-poi-open body{overflow:hidden}
  .sd2_poi_backdrop{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .sd2_poi_group .sd2_nearby_row:last-child{border-bottom:0}
  .sd2_poi_link:focus-visible{outline:2px solid #A9754B;outline-offset:3px}

  /* waitlist form: home chips (built by the bundle from the Units list) */
  .sd2_wl_label{font-size:.75rem;letter-spacing:.06em;color:rgba(246,243,238,.6);margin:.25rem 0 .625rem}
  .sd2_wl_chips{display:flex;flex-wrap:wrap;gap:.5rem}
  .sd2_wl_chip{appearance:none;-webkit-appearance:none;border:1px solid rgba(246,243,238,.28);background:transparent;color:#F6F3EE;border-radius:999px;padding:.5rem .875rem;font:inherit;font-size:.78rem;line-height:1.2;cursor:pointer;transition:background-color .25s,border-color .25s,color .25s}
  .sd2_wl_chip:hover{border-color:#C79A6E}
  .sd2_wl_chip.is-active{background-color:#C79A6E;border-color:#C79A6E;color:#1C1A17}
  .sd2_form_note.is-error{color:#E8A89E}
  [data-sd2-detail=cta].is-on-list{background-color:#A9754B;color:#FCFAF7}
  .sd2_price_note{margin:.35rem 0 0;font-size:.75rem;line-height:1.45;color:rgba(28,26,23,.55)}

  /* favourites in the sticky bar (signed-in members only; built by the bundle) */
  .sd2_bar_favs{position:relative;display:none;align-items:center;gap:.375rem;margin-left:auto;margin-right:.625rem}
  html.sd2-signed-in .sd2_bar_favs{display:flex}
  .sd2_fav_btn{appearance:none;display:grid;place-items:center;width:2.5rem;height:2.5rem;padding:0;border:1px solid rgba(246,243,238,.22);border-radius:50%;background:transparent;color:rgba(246,243,238,.8);cursor:pointer;transition:color .25s,border-color .25s,transform .35s cubic-bezier(.2,.7,.2,1)}
  .sd2_fav_btn path{fill:transparent;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;transition:fill .25s}
  .sd2_fav_btn:hover{border-color:#C79A6E;color:#F6F3EE}
  .sd2_fav_btn.is-on{border-color:#C79A6E;color:#C79A6E}
  .sd2_fav_btn.is-on path{fill:currentColor}
  .sd2_fav_btn.is-pop{animation:sd2-fav-pop .45s cubic-bezier(.2,.7,.2,1)}
  @keyframes sd2-fav-pop{40%{transform:scale(1.18)}100%{transform:scale(1)}}
  .sd2_fav_btn:disabled{opacity:.35;cursor:default}
  .sd2_fav_btn:focus-visible,.sd2_fav_count:focus-visible{outline:2px solid #C79A6E;outline-offset:2px}
  .sd2_fav_count{appearance:none;min-width:1.75rem;height:1.75rem;padding:0 .55rem;border:0;border-radius:999px;background:rgba(246,243,238,.12);color:#F6F3EE;font:600 .75rem/1 Manrope,sans-serif;cursor:pointer}
  .sd2_fav_count[hidden]{display:none}
  .sd2_fav_pop{position:absolute;right:0;bottom:calc(100% + 1rem);display:none;min-width:14rem;padding:.375rem;border-radius:.75rem;background:#F6F3EE;color:#1C1A17;box-shadow:0 18px 50px rgba(0,0,0,.35)}

  .sd2_fav_pop_title{margin:0;padding:.6rem .625rem .4rem;color:#A9754B;font:500 .625rem/1 Manrope,sans-serif;letter-spacing:.16em;text-transform:uppercase}
  .sd2_fav_row{display:flex;align-items:center}
  .sd2_fav_item{flex:1;appearance:none;padding:.55rem .625rem;border:0;border-radius:.5rem;background:transparent;color:#1C1A17;font:500 .875rem/1.2 Manrope,sans-serif;text-align:left;cursor:pointer}
  .sd2_fav_item span{display:block;margin-top:.2rem;color:rgba(28,26,23,.55);font-size:.75rem;font-weight:400}
  .sd2_fav_item:hover,.sd2_fav_x:hover{background:rgba(28,26,23,.06)}
  .sd2_fav_x{appearance:none;width:2rem;height:2rem;border:0;border-radius:50%;background:transparent;color:rgba(28,26,23,.45);font-size:1rem;cursor:pointer}
  @media screen and (max-width: 767px){
    .sd2_bar_favs{margin-right:.375rem;gap:.25rem}
    .sd2_fav_btn{width:2.25rem;height:2.25rem}

    html.sd2-member .sd2_bar_price{white-space:nowrap}
  }

  /* team, grouped by the bundle from each card's Portal Group */
  .sd2_team_groups{display:grid;gap:2.75rem}
  .sd2_team_group_head{font-family:var(--_sanford-v2---sd2-font-accent);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:#A9754B;margin-bottom:1rem;padding-bottom:.75rem;border-bottom:1px solid rgba(28,26,23,.12)}
  .sd2_team_group_label{display:none}

  /* street map: "Back to Aerial" is sticky, clearing the fixed nav. overflow:hidden on the

  /* street map (MapLibre + OpenFreeMap, built by the bundle): markers and controls */
  .sd2_aerial_map_host .maplibregl-canvas{outline:none}
