<!-- Napier Heart (/napier-dev) — Page settings › Inside <head> tag.
     Note: the outlined-type (-webkit-text-stroke) and line-clamp rules live in a small named Embed
     element at the top of the page ("Styles · text-stroke + line-clamp"), not here.
     Source of truth lives in the repo (src/napier/page-head.html); paste the whole block.
     Everything Webflow's style panel cannot express lives here: JS state classes (.in, .is-on,
     .is-open …), nested selectors, keyframes, pseudo-elements, the gate and the auth dialog. -->
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="preconnect" href="https://p.typekit.net" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/bkf6xwj.css">
<link rel="preload" as="image" fetchpriority="high" href="https://cdn.prod.website-files.com/61110f294933f9d0faf6d77f/6ad66f96cd6d481041d131ef_nh-studio-living-bed.avif">
<!-- Memberstack (the Heartland app): the waitlist is a passwordless sign-up onto the Napier Heart
     plan. Deferred; the bundle waits for window.$memberstackDom. webflow.io runs in SANDBOX. -->
<script data-memberstack-app="app_cmmoyq2ln006j0ssyfcttbd9q" src="https://static.memberstack.com/scripts/v2/memberstack.js" type="text/javascript" defer></script>
<script>
  /* Loader "Through the arch": ink screen with an arch window on the hero photo that grows with the load,
     opens to the full frame, then pulls back out of the N into the hero's name mask (bundle module 2b).
     Shown once per tab session, from the top of the page; skipped for reduced motion and #links. */
  (function (h) {
    h.classList.add('nh-js');
    setTimeout(function () { h.classList.add('nh-nav-ok'); }, 9000);   /* failsafe if the bundle never runs */
    if (matchMedia('(prefers-reduced-motion: reduce)').matches || location.hash) { return; }
    try { if (sessionStorage.getItem('nh-ld')) { return; } } catch (e) {}
    if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }
    h.classList.add('nh-loading', 'nh-ld-arch');
    setTimeout(function () { if (!window.NH_LD) { h.classList.remove('nh-loading', 'nh-ld-arch'); } }, 9000);
  })(document.documentElement);
</script>
<style>
  /* ---------------- page */
  html{scroll-behavior:smooth;scroll-padding-top:5.5rem}
  .nh_page{--nh-ease:cubic-bezier(.22,1,.36,1)}
  .nh_page *{box-sizing:border-box}
  .nh_page img{max-width:100%}
  /* loader: #nh-loader (native div + SVG arch mask) over everything until the bundle hands over */
  .nh_loader{display:none}
  html.nh-loading{overflow:hidden}
  html.nh-loading .nh_loader{display:block}
  .nh_ld_arch{transform:translate(50vw,50svh) scale(1.5)}
  html.nh-ld-arch .nh_hero_mask{opacity:0}
  html.nh-loading [data-nh-nav],html.nh-loading .nh_hero_cue{opacity:0;pointer-events:none}
  html.nh-loading .nh_hero_mask svg{transform:none;transition:none}
  /* the nav stays hidden until the bundle's first frame has set its state (it is .is-pre over the hero intro);
     the reveal fade must never override .is-pre, or the nav flashes over the name mask */
  html.nh-js:not(.nh-nav-ok) [data-nh-nav]{opacity:0;pointer-events:none}
  html.nh-ld-reveal [data-nh-nav]:not(.is-pre),html.nh-ld-reveal .nh_hero_cue{animation:nh-fade-in 1s var(--nh-ease,cubic-bezier(.22,1,.36,1)) both}
  @keyframes nh-fade-in{from{opacity:0}to{opacity:1}}
  @keyframes nh-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes nh-swap{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
  @keyframes nh-text{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes nh-pin{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
  @keyframes nh-fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes nh-kb{from{transform:scale(1.04) translate3d(0,0,0)}to{transform:scale(1.15) translate3d(-1.6%,-1.2%,0)}}
  @keyframes nh-cue{from{transform:translateY(-100%)}to{transform:translateY(100%)}}
  @keyframes nh-mq{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}

  /* ---------------- grain on every section surface */
  .nh_section::after,.nh_bleed::after,.nh_mq::after,.nh_footer::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:soft-light;background-image:repeating-radial-gradient(circle at 3px 7px,#000 0 1px,transparent 1px 9px),repeating-radial-gradient(circle at 11px 2px,#000 0 1px,transparent 1px 13px)}
  .nh_section{position:relative}
  .nh_footer{position:relative}

  /* ---------------- reveals (initial states only once JS has arrived) */
  html.nh-js .nh_rise{opacity:0;transform:translateY(32px);transition:opacity 1100ms var(--nh-ease),transform 1300ms var(--nh-ease);transition-delay:var(--d,0ms)}
  html.nh-js .nh_rise.in{opacity:1;transform:none}
  html.nh-js .nh_rv img{clip-path:inset(0 0 100% 0);transform:scale(1.1);transition:clip-path 1000ms var(--nh-ease),transform 1600ms var(--nh-ease)}
  html.nh-js .nh_rv.in img{clip-path:inset(0 0 0 0);transform:scale(1)}
  html.nh-js .nh_rv .nh_cap{opacity:0;transform:translateY(6px);transition:opacity 500ms var(--nh-ease) 500ms,transform 500ms var(--nh-ease) 500ms}
  html.nh-js .nh_rv.in .nh_cap{opacity:1;transform:none}
  .nh_rv.is-lift{transition:transform 300ms var(--nh-ease)}
  .nh_rv.is-lift.in:hover{transform:translateY(-2px)}
  .nh_rv.is-lift.in:hover img{transform:scale(1.03)}
  .nh_hero_side + .nh_hero_side img{transition-delay:140ms}
  .nh_sw{display:inline-block;white-space:nowrap}
  html.nh-js .nh_c{display:inline-block;opacity:0;transform:translate3d(0,.5em,0);transition:opacity 900ms var(--nh-ease),transform 1200ms var(--nh-ease);transition-delay:var(--d,0ms)}
  html.nh-js .nh_split_text.in .nh_c{opacity:1;transform:none}
  .nh_li_wrap{opacity:0;transition:opacity 1400ms var(--nh-ease)}
  .nh_li_wrap.in{opacity:1}
  .nh_li_layer.is-b .nh_li_word{color:#2B2622}
  .nh_bleed .nh_cap{opacity:0;transform:translateY(6px);transition:opacity 500ms var(--nh-ease) 500ms,transform 500ms var(--nh-ease) 500ms}
  .nh_bleed.in .nh_cap{opacity:1;transform:none}

  /* ---------------- buttons: a rounded fill paints up from the bottom */
  .nh_btn{--fill:#2B2622;--on:#F3EBE2}
  .nh_btn::before{content:"";position:absolute;z-index:-1;left:-1px;right:-1px;bottom:0;height:calc(100% + 1.75rem);background:var(--fill);border-radius:50% 50% 0 0 / 1.75rem 1.75rem 0 0;transform:translateY(101%);transition:transform 650ms var(--nh-ease)}
  .nh_btn:hover::before,.nh_btn:focus-visible::before{transform:translateY(0)}
  .nh_btn:hover,.nh_btn:focus-visible{color:var(--on)}
  .nh_btn:active{transform:scale(.97)}
  .nh_btn:focus-visible{outline:2px solid #8C3B4A;outline-offset:3px}
  .nh_btn svg{transition:transform 450ms var(--nh-ease)}
  .nh_btn:hover svg{transform:translateX(3px)}
  .nh_btn.is-light{--fill:#C9957F;--on:#2B2622}
  .nh_btn.is-ghost-light{--fill:#F3EBE2;--on:#2B2622}
  .nh_card.is-accent .nh_btn.is-light{--fill:#2B2622;--on:#F3EBE2}
  .nh_link:hover{background-size:100% 1px}
  .nh_card:hover{transform:translateY(-2px);box-shadow:0 18px 40px -26px rgba(43,38,34,.45)}
  .nh_tile:hover{background:rgba(243,235,226,.08);border-color:rgba(243,235,226,.5);transform:translateY(-2px)}
  .nh_tile .nh_btn_icon{transition:transform 450ms var(--nh-ease)}
  .nh_tile:hover .nh_btn_icon{transform:translateX(4px)}
  .nh_ctl:hover{background:#2B2622 !important;color:#FBF7F2 !important}
  .nh_ctl:active{transform:scale(.95)}
  .nh_pro:hover{opacity:1;background:#FBF7F2}
  .nh_pro:hover .nh_pro_img{filter:none;opacity:1}
  .nh_bank_img:hover{opacity:.9}
  .nh_doc:hover{padding-left:0.5rem;color:#8C3B4A}
  .nh_plan_link:hover{color:#8C3B4A}
  .nh_room:hover{color:#8C3B4A}
  .nh_room.is-on .nh_room_name{color:#8C3B4A;transform:translateX(8px)}
  .nh_mq_i:hover .nh_mq_img{transform:scale(1.06)}
  .nh_play:hover{transform:scale(1.05)}

  /* ---------------- nav */
  .nh_nav.is-pre{opacity:0;transform:translateY(-12px);pointer-events:none}
  .nh_nav.is-solid{background-color:rgba(243,235,226,.78) !important;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom-color:rgba(43,38,34,.1) !important}
  .nh_nav.is-hide{transform:translateY(-100%)}
  .nh_nav:not(.is-ink) a,.nh_nav:not(.is-ink) span{color:#F3EBE2}
  .nh_nav:not(.is-ink) .nh_btn.is-solid{background-color:#F3EBE2;color:#2B2622;--fill:#8C3B4A;--on:#F3EBE2}
  .nh_nav.is-ink a{color:#2B2622}
  .nh_nav.is-ink .nh_btn.is-solid{background-color:#8C3B4A;color:#F3EBE2;--fill:#2B2622}
  .nh_nav .nh_btn.is-solid:hover{color:var(--on) !important}

  /* ---------------- hero */
  .nh_hero_frame{clip-path:inset(0 0 0 0 round 0px)}
  .nh_hero_poster{animation:nh-kb 26s ease-in-out infinite alternate;will-change:transform}
  .nh_hero_mask{will-change:transform}
  .nh_hero_mask svg{display:block;width:100%;height:100%;transform:scale(1.035);transition:transform 2800ms var(--nh-ease)}
  .nh_hero_mask.in svg{transform:none}
  .nh_hero_mask .nh_hero_mask_fade{opacity:0;transition:opacity 900ms var(--nh-ease) 350ms}
  .nh_hero_mask.in .nh_hero_mask_fade{opacity:1}
  .nh_hero_cue_line::after{content:"";position:absolute;left:0;top:0;width:1px;height:2.875rem;background:#C9957F;animation:nh-cue 2.2s var(--nh-ease) infinite}
  .nh_hero_intro{will-change:opacity,transform}
  .nh_hero_cap{transition:opacity 500ms var(--nh-ease)}
  html:not(.nh-js) .nh_hero_mask,html:not(.nh-js) .nh_hero_frame{display:none}

  /* ---------------- studios */
  .nh_stage_img.is-on{opacity:1;transform:scale(1)}
  .nh_stage_cap.is-swap{animation:nh-text .6s var(--nh-ease) both}
  @media (prefers-reduced-motion: reduce){.nh_sx_img.is-render{-webkit-mask-image:none !important;mask-image:none !important}.nh_sx_line{transform:none !important}}

  /* ---------------- lofts */
  .nh_spec.is-dark .nh_spec_icon{color:#C9957F}
  .nh_spec.is-dark .nh_spec_k{color:rgba(243,235,226,.7)}
  .nh_spec.is-dark .nh_spec_v{color:#F3EBE2}

  /* ---------------- compare + toggles */
  .nh_cmp_range::-webkit-slider-thumb{-webkit-appearance:none;width:4rem;height:100%}
  .nh_cmp_range::-moz-range-thumb{width:4rem;height:100%;border:0;background:transparent}
  .nh_cmp_range:active ~ .nh_cmp_knob,.nh_cmp_range:hover ~ .nh_cmp_knob{transform:translate(-50%,-50%) scale(1.08)}
  .nh_cmp_pair.is-swap img{animation:nh-swap 1s var(--nh-ease) both}
  .nh_finish_p.is-swap{animation:nh-text .6s var(--nh-ease) both}
  .nh_seg_btn.is-on{color:#F3EBE2}
  .nh_seg_btn:active{transform:scale(.97)}

  /* ---------------- marquee */
  .nh_mq_track{animation:nh-mq 70s linear infinite;animation-play-state:paused}
  .nh_mq.is-run .nh_mq_track{animation-play-state:running}
  .nh_mq:hover .nh_mq_track{animation-play-state:paused}

  /* ---------------- neighbourhood */
  .nh_day_slide.is-on .nh_day_img{transform:scale(1)}
  .nh_day_cap.is-swap{animation:nh-rise .9s var(--nh-ease) both}
  .nh_day_seg.is-on .nh_day_seg_label{color:#8C3B4A}
  .nh_day_seg.is-done .nh_day_seg_fill{transform:scaleX(1)}
  .nh_day_seg_fill.is-run{animation:nh-fill 6500ms linear both}
  .nh_day.is-paused .nh_day_seg_fill.is-run{animation-play-state:paused}
  .nh_prow.is-on .nh_prow_name{color:#8C3B4A}
  .nh_prow:hover{background:rgba(140,59,74,.06)}
  .nh_prow.is-in{animation:nh-text .7s var(--nh-ease) both}
  .nh_plist.is-out,.nh_pins.is-out{opacity:0;transform:translateY(8px)}
  .nh_pin_wrap.is-in{animation:nh-pin .55s var(--nh-ease) both}
  .nh_pin_wrap.is-on .nh_pin_dot{width:1.375rem;height:1.375rem;box-shadow:0 0 0 6px rgba(140,59,74,.18),0 2px 6px rgba(43,38,34,.25)}
  .nh_pin_wrap.is-on .nh_pin_tag,.nh_pin_wrap.is-hover .nh_pin_tag{opacity:1;animation:nh-text .28s var(--nh-ease) both}
  .nh_pcard.is-swap{animation:nh-text .7s var(--nh-ease) both}
  .nh_pcard_img.is-swap{animation:nh-swap 1.4s var(--nh-ease) both}
  .nh_chip:active{transform:scale(.97)}
  .nh_dpin.is-on .nh_dpin_dot{width:1.125rem;height:1.125rem;background-color:#8C3B4A}
  .nh_dpin.is-on .nh_dpin_tag,.nh_dpin:hover .nh_dpin_tag{background-color:#8C3B4A;color:#FBF7F2}
  .nh_dpin:hover .nh_dpin_tag{background-color:#2B2622}
  .nh_dcard.is-on .nh_dcard_img{transform:scale(1)}

  /* ---------------- availability */
  .nh_unit:hover{background-color:rgba(143,165,146,.4)}
  .nh_unit:hover .nh_unit_lab,.nh_unit.is-on .nh_unit_lab{opacity:1;transform:none}
  .nh_unit.is-on{border-color:#F3EBE2;box-shadow:0 0 0 1px #F3EBE2;background-color:rgba(243,235,226,.06)}
  .nh_unit.is-reserved{border-color:#C9957F;background-color:rgba(201,149,127,.26);cursor:default}
  .nh_unit.is-sold{border-color:#8C3B4A;background-color:rgba(140,59,74,.38);cursor:default}
  .nh_unit.is-reserved:hover{background-color:rgba(201,149,127,.26)}
  .nh_unit.is-sold:hover{background-color:rgba(140,59,74,.38)}
  .nh_unit.is-loft,.nh_unit.is-loft:hover,.nh_unit.is-loft.is-on{border-color:transparent !important;background-color:transparent !important;box-shadow:none}
  .nh_lp.is-reserved{fill:rgba(201,149,127,.26);stroke:#C9957F}
  .nh_lp.is-sold{fill:rgba(140,59,74,.38);stroke:#8C3B4A}
  .nh_facade:has(.nh_unit.is-loft:not(.is-reserved):not(.is-sold):hover) .nh_lp:not(.is-reserved):not(.is-sold){fill:rgba(143,165,146,.4)}
  /* loft polygons sit in a stretched 0-100 viewBox: keep their strokes in screen px so they match the studios' 1.5px border (2.5px when selected) */
  .nh_lp{vector-effect:non-scaling-stroke}
  .nh_lp.is-on{stroke:#F3EBE2;stroke-width:2.5px;fill:rgba(243,235,226,.06)}
  .nh_home_media img.is-swap{animation:nh-swap 1.1s var(--nh-ease) both}
  .nh_home_body.is-swap{animation:nh-text .6s var(--nh-ease) both}
  .nh_toast.is-on,.nh_gtoast.is-on{opacity:1;transform:none}
  .nh_gtoast.is-on{transform:translate(-50%,0)}
  [data-nh-home-cta].is-on-list{background-color:#2B2622}
  .nh_fincard.is-swap .nh_finrow_v,.nh_fincard.is-swap .nh_fin_monthly{animation:nh-text .6s var(--nh-ease) both}
  .nh_vr_pane{transition:opacity 800ms var(--nh-ease)}

  /* ---------------- explore more: collapsed until the button is tapped (only when JS runs), like Sanford.
     Opacity only, no translate, so a jump into an opened section lands where it should. */
  html.nh-js .nh_more:not(.is-open){display:none}
  .nh_more.is-open{display:block;animation:nh-fade-in .7s ease both}
  .nh_more_btn svg{transition:transform 500ms var(--nh-ease)}
  .nh_more_btn:hover svg{transform:translateY(3px)}
  .nh_more_btn.is-open svg{transform:rotate(180deg)}

  /* ---------------- overlays */
  .nh_pm.is-open,.nh_auth.is-open{visibility:visible;pointer-events:auto;transition-delay:0s}
  .nh_pm.is-open .nh_pm_bg,.nh_auth.is-open .nh_pm_bg{opacity:1}
  .nh_pm.is-open .nh_pm_panel,.nh_auth.is-open .nh_auth_panel{opacity:1;transform:none}
  .nh_pm.is-lbx .nh_pm_bg{background-color:rgba(30,26,23,.94)}
  .nh_pm.is-open .nh_lbx_stage{opacity:1;transform:none}
  .nh_lbx_img.is-swap{animation:nh-swap .7s var(--nh-ease) both}
  .nh_lbx_btn:hover{background-color:rgba(243,235,226,.18)}
  .nh_lbx_btn:active{transform:scale(.95)}
  html.nh-modal-open,html.nh-auth-open{overflow:hidden}
  .nh_sbar.is-on{transform:translate(-50%,0)}
  html:not(.nh-signed-in) .nh_sbar_list{display:none}
  .nh_demo_pill a:hover{text-decoration:underline}

  /* ---------------- phases: html.nh-prelaunch / nh-live / nh-gated / nh-member (set by the bundle) */
  html:not(.nh-prelaunch) [data-nh-countdown]{display:none}
  html.nh-launched .nh_countdown_grid{display:none}
  .nh_countdown_cell{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .nh_countdown_num{font-variant-numeric:tabular-nums}
  /* the gate: the façade and the detail card blur, the gate card sits over them */
  html.nh-gated .nh_avail > :not(.nh_gate){transition:filter .7s var(--nh-ease)}
  html.nh-gated:not(.nh-member) .nh_avail > :not(.nh_gate){filter:blur(16px) saturate(.8);pointer-events:none;user-select:none}
  html.nh-gated:not(.nh-member) .nh_gate{opacity:1;visibility:visible;transition:opacity .5s ease}
  html:not(.nh-auth-known) .nh_gate_card{opacity:.001}
  .nh_gate_card{transition:opacity .5s ease;-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%)}
  /* prices are not blurred: the figure collapses and a prompt takes its place */
  html.nh-gated:not(.nh-member) [data-nh-price]{font-size:0 !important;letter-spacing:0 !important;cursor:pointer;user-select:none}
  html.nh-gated:not(.nh-member) [data-nh-price]::after{content:"Join waitlist to see pricing";display:inline-block;font-family:halyard-text,sans-serif;font-size:0.8125rem;font-weight:400;line-height:1.4;letter-spacing:.01em;text-transform:none;font-style:normal;color:inherit;text-decoration:underline;text-decoration-color:#C9957F;text-decoration-thickness:1px;text-underline-offset:4px;transition:text-decoration-color .25s ease}
  html.nh-gated:not(.nh-member) [data-nh-price]:hover::after{text-decoration-color:currentColor}
  html.nh-gated:not(.nh-member) [data-nh-price=derived]::after{content:"—";font-size:1rem;text-decoration:none;opacity:.45}
  html.nh-live:not(.nh-member) [data-nh-price]::after{content:"Sign up to see pricing"}
  html.nh-live:not(.nh-member) [data-nh-price=derived]::after{content:"—"}
  html.nh-live:not(.nh-gated):not(.nh-member) [data-nh-price]{font-size:inherit !important}
  html.nh-live:not(.nh-gated):not(.nh-member) [data-nh-price]::after{content:none}
  html.nh-live [data-nh-wl-picker]{display:none}
  html.nh-signed-in .nh_signout{display:inline}

  /* ---------------- waitlist form (native Webflow form inside .nh_formwrap) */
  .nh_formwrap .w-form{margin:0}
  .nh_formwrap form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.125rem}
  .nh_field{display:flex;flex-direction:column;gap:0.375rem;font-size:0.8125rem;color:rgba(43,38,34,.7);margin:0}
  .nh_field.is-wide,.nh_form_row,.nh_form_note,[data-nh-wl-picker]{grid-column:span 2}
  .nh_field label,.nh_field_label{font-size:0.8125rem;font-weight:400;color:rgba(43,38,34,.7);margin:0;display:block}
  .nh_input,.nh_formwrap .w-input,.nh_formwrap .w-select{height:3rem;border:1px solid rgba(43,38,34,.22);border-radius:0.25rem;background:#FBF7F2;padding:0 0.875rem;margin:0;font-family:halyard-text,sans-serif;font-size:0.9375rem;color:#2B2622;transition:border-color 250ms var(--nh-ease)}
  .nh_input:hover,.nh_formwrap .w-input:hover,.nh_formwrap .w-select:hover{border-color:rgba(43,38,34,.4)}
  .nh_input:focus,.nh_formwrap .w-input:focus,.nh_formwrap .w-select:focus{outline:2px solid #8C3B4A;outline-offset:2px;border-color:rgba(43,38,34,.22)}
  .nh_formwrap .w-input::placeholder{color:rgba(43,38,34,.4)}
  .nh_form_row{display:flex;flex-wrap:wrap;align-items:center;gap:0.875rem;margin-top:0.375rem}
  .nh_formwrap .w-button,.nh_submit{height:3rem;padding:0 1.625rem;border:0;border-radius:0.25rem;background:#8C3B4A;color:#F3EBE2;font-family:halyard-text,sans-serif;font-size:0.875rem;cursor:pointer;transition:background-color 350ms var(--nh-ease),transform 160ms var(--nh-ease)}
  .nh_formwrap .w-button:hover,.nh_submit:hover{background-color:#2B2622}
  .nh_formwrap .w-button:active{transform:scale(.97)}
  .nh_form_note{font-size:0.75rem;color:rgba(43,38,34,.7);line-height:1.5;margin:0}
  .nh_form_note.is-error{color:#8C3B4A}
  .nh_formwrap .w-form-done{background:transparent;padding:2.5rem 0;text-align:left;font-family:orpheuspro,serif;font-size:2rem;line-height:1.1;color:#2B2622}
  .nh_formwrap .w-form-fail{background:transparent;color:#8C3B4A;padding:0.75rem 0;font-size:0.875rem}
  .nh_wl_label{font-size:0.8125rem;color:rgba(43,38,34,.7);margin:0 0 0.625rem}
