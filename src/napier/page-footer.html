<style>
  /* Explore more: collapsed until the button is tapped (only when JS runs), like Sanford. Lives here, not
     in the head block, so the change ships without re-pasting the 21 KB head. The block sits far below the
     fold, so a rule at the end of the body never shows a flash. Opacity only, no translate. */
  html.nh-js .nh_more:not(.is-open){display:none}
  .nh_more.is-open{animation:nh-fade-in .7s ease both}
  /* one-way, like Sanford: once the sections are open the button goes (no Show Less) */
  .nh_more_btn.is-open{display:none}
</style>
