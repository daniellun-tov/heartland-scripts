<!-- Oak Hills unit selection v2 - page head custom code. The state CSS lives in the repo at
     assets/oh/oh-v2.css and is served from jsDelivr at a pinned commit, the same release path as
     heartland-oh.js in the footer: edit the file, push, paste the new SHA into both tags, publish.
     (It used to be a 25 KB <style> block pasted into this field, which drifted from the repo.) -->
<meta name="robots" content="noindex, nofollow">
<script>
  /* Both start before first paint: oh-app-pending hides the shell until the controller
     has prepared it, oh-reveal holds the plan and the panels out of sight until the map
     is real. The failsafe clears the reveal if heartland-oh.js never arrives. */
  (function () {
    var h = document.documentElement;
    h.classList.add('oh-app-pending', 'oh-reveal');
    setTimeout(function () { if (!window.ohMapLoader) h.classList.remove('oh-reveal'); }, 8000);
  })();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/daniellun-tov/heartland-scripts@a026ca06314efe1f35323595191747664ac19ebf/assets/oh/oh-v2.css">
