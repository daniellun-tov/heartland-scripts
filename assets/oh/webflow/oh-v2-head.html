<!-- Oak Hills unit selection v2 - state CSS. Component classes live in the Designer; this block holds everything Webflow classes cannot express: attribute selectors, state classes set by heartland-oh.js, JS-generated markup and the mobile drawer. -->
<meta name="robots" content="noindex, nofollow">
<script>document.documentElement.classList.add('oh-app-pending');</script>
<style>
/* ---- tokens ---- */
.page_wrap[data-oh-v2]{
  --oh-available: var(--_colours---success--success-1, #7f9780);
  --oh-reserved: var(--_colours---warning--warning-2, #ddb365);
  --oh-sold: var(--_colours---error--error-2, #eb5853);
  --oh-unreleased: var(--_colours---sand--s-300, #b5b3ad);
  --oh-type-a: var(--_colours---mahogany--mahogany, #5f4d3f);
  --oh-type-b: var(--_colours---merlot--m-100, #c7907b);
  --oh-type-c: var(--_colours---vinyard-night--vn-200, #6f786c);
  --oh-ink: var(--_colours---mahogany--mahogany, #5f4d3f);
  --oh-accent: var(--_colours---merlot--m-200, #af6042);
  --oh-line: var(--_colours---sand--s-100, #dedbd3);
  --oh-sand: var(--_colours---sand--s-50, #f2efe6);
}
.site-plan_card-title,.site-plan_tooltip-id,.unit-details_price,.unit-details_spec-value{font-family:var(--_typography---font--secondary-family, "Tenor Sans", serif)}

/* ---- labels: every control label carries a full and a short form (heartland-oh.js), the breakpoint picks one ---- */
.oh-lbl-short{display:none}
@media (max-width:991px){.oh-lbl-full{display:none}.oh-lbl-short{display:inline}}

/* ---- legend swatches & pills ---- */
.site-plan_legend-swatch.is-available{background:var(--oh-available)}
.site-plan_legend-swatch.is-reserved{background:var(--oh-reserved)}
.site-plan_legend-swatch.is-sold{background:var(--oh-sold)}
.site-plan_legend-swatch.is-unreleased{background:linear-gradient(135deg,rgba(21,23,20,.6),rgba(21,23,20,.26)),var(--oh-sand)}
.site-plan_legend-swatch.is-type-a{background:var(--oh-type-a)}
.site-plan_legend-swatch.is-type-b{background:var(--oh-type-b)}
.site-plan_legend-swatch.is-type-c{background:var(--oh-type-c)}
.site-plan_legend-group.is-legend-hidden{display:none}
html:not(.legends-ready) .site-plan_legend-group[data-legend-group="type"]{display:none}
.site-plan_pill.is-available{background:var(--oh-available)}
.site-plan_pill.is-reserved,.site-plan_pill.is-pending{background:var(--oh-reserved);color:var(--oh-ink)}
.site-plan_pill.is-sold,.site-plan_pill.is-sold-out{background:var(--oh-sold)}
.site-plan_pill.is-unreleased{background:var(--oh-unreleased);color:var(--oh-ink)}

/* ---- toggles, chips, sort ---- */
/* active pill = ink (it used to be white, which vanished on the white toolbar) */
.site-plan_colourby-btn.is-active,.unit-filter_view-btn.is-current{background:var(--oh-ink);color:#fff;box-shadow:none}
.site-plan_sort-btn.is-active{background:var(--oh-sand);color:var(--oh-ink)}
[data-filter][data-value]:hover,[data-toggle]:hover{border-color:var(--oh-ink)}
[data-filter][data-value].is-active,[data-toggle].is-active{background:var(--oh-ink);border-color:var(--oh-ink);color:#fff}
[data-filter][data-value].is-active .unit-filter_count,[data-toggle].is-active .unit-filter_count{color:rgba(255,255,255,.7)}
[data-filter][data-value].is-disabled,[data-toggle].is-disabled{opacity:.4;pointer-events:none;cursor:default}
[data-filter][data-value].is-coming-soon{opacity:.55;pointer-events:none;cursor:default}
.unit-filter_soon,.site-plan_legend-soon{display:inline-block;margin-left:.4rem;padding:.1rem .45rem;border-radius:999px;background:var(--oh-sand);color:var(--oh-ink);font-size:.6875rem;line-height:1.4;white-space:nowrap}
.site-plan_legend-item.is-coming-soon{opacity:.6}
.site-plan_switch-label{display:inline-flex;align-items:center;padding:0 .5rem 0 .75rem;font-size:.6875rem;letter-spacing:.08em;text-transform:uppercase;color:var(--oh-ink);opacity:.7;white-space:nowrap}
.unit-filter_more-list.svx-more-collapsed{max-height:0!important;margin:0}
.unit-filter_more-list.svx-more-open{max-height:none}
.unit-filter_more-button.is-open .unit-filter_more-icon{transform:rotate(-135deg);margin-top:.25rem}

/* ---- map: block footprints ---- */
.site-plan_map-svg .site-plan_block{fill:var(--oh-ink);fill-opacity:.07;stroke:#fff;stroke-width:2;cursor:pointer;transition:fill-opacity .2s,stroke .2s}
.site-plan_map-svg .site-plan_block:hover{fill-opacity:.14}
.site-plan_map-svg .site-plan_block.is-selected{stroke:var(--oh-ink);stroke-width:3;fill-opacity:.12}
.site-plan_map-svg .site-plan_block.is-dimmed{fill-opacity:.04;stroke-opacity:.5}
/* phase 2: unit-level plots share the same states */
.site-plan_map-svg .site-plan_plot{cursor:pointer;stroke:#fff;stroke-width:1}
.is-colour-status .site-plan_plot[data-status="available"]{fill:var(--oh-available)}
.is-colour-status .site-plan_plot[data-status="reserved"],.is-colour-status .site-plan_plot[data-status="pending"]{fill:var(--oh-reserved)}
.is-colour-status .site-plan_plot[data-status="sold"]{fill:var(--oh-sold)}
.is-colour-status .site-plan_plot[data-status="unreleased"]{fill:url(#oh-soon)}
.is-colour-type .site-plan_plot[data-type="A"]{fill:var(--oh-type-a)}
.is-colour-type .site-plan_plot[data-type="B"]{fill:var(--oh-type-b)}
.is-colour-type .site-plan_plot[data-type="C"]{fill:var(--oh-type-c)}
.is-colour-type .site-plan_plot[data-status="unreleased"]{fill-opacity:.3}
.is-colour-type .site-plan_plot[data-status="unreleased"]:hover{fill-opacity:.5}
@media (hover:hover){.site-plan_map-svg .site-plan_plot{fill-opacity:.72;transition:fill-opacity .15s}.site-plan_map-svg .site-plan_plot:hover,.site-plan_map-svg .site-plan_plot.is-selected{fill-opacity:1}}
.site-plan_plot.is-dimmed{opacity:.2}
.site-plan_plot.is-selected{stroke:var(--oh-ink);stroke-width:3}
/* coming soon: a graded dark wash (the gradient is injected into the plan by heartland-oh.js) */
.site-plan_map-svg .site-plan_plot[data-status="unreleased"]{cursor:pointer;fill-opacity:1}
.is-colour-status .site-plan_plot[data-status="unreleased"]:hover{fill:url(#oh-soon-hi)}
.site-plan_map-svg .site-plan_plot.is-static{cursor:default}
.site-plan_tooltip [hidden]{display:none!important}
.site-plan_map-canvas.has-floors [data-floor]:not(.is-current){display:none}
.unit-filter_map{position:relative}
/* labels: unit numbers scale with the plan and fade out when zoomed out; estate labels grow when zoomed out */
.site-plan_unit-label{font-family:var(--_typography---font--primary-family, "Helvetica Neue", sans-serif);font-size:12px;font-weight:700;fill:#1f1911;pointer-events:none;paint-order:stroke;stroke:rgba(255,255,255,.95);stroke-width:2.8px;stroke-linejoin:round;opacity:clamp(0,calc((var(--oh-zoom,1) - .65) / .3),1);transition:opacity .2s}
.site-plan_unit-label.is-bay{font-size:6.5px;font-weight:600;stroke-width:1.5px}
.site-plan_unit-label[data-status="unreleased"],.site-plan_unit-label.is-dimmed{display:none}
.site-plan_feature{font-family:var(--_typography---font--primary-family, "Helvetica Neue", sans-serif);font-size:calc(15px / var(--oh-zoom,1));letter-spacing:.06em;text-transform:uppercase;fill:#574a3d;pointer-events:none;paint-order:stroke;stroke:rgba(242,239,230,.9);stroke-width:calc(4px / var(--oh-zoom,1));opacity:clamp(.35,calc(1.6 - var(--oh-zoom,1) * .7),1)}
.site-plan_feature.is-street{font-size:calc(13px / var(--oh-zoom,1));fill:#655749}
.site-plan_feature.is-road{font-size:calc(19px / var(--oh-zoom,1));fill:#5f4d3f}
.site-plan_feature.is-area{font-size:calc(24px / var(--oh-zoom,1));fill:#9b9187;letter-spacing:.14em}
.site-plan_map-canvas:not(.has-floors) [data-layer="features"],.site-plan_map-canvas.has-floors [data-layer="features"]{pointer-events:none}
/* parking level */
.site-plan_map-svg .site-plan_bay-free{fill:#fff;fill-opacity:.35;stroke:rgba(95,77,63,.35);stroke-width:.6;pointer-events:none}
.site-plan_map-svg .site-plan_plot.is-bay{stroke:#fff;stroke-width:.6}
.site-plan_map-canvas.is-parking-view .site-plan_block{fill-opacity:.05}
.site-plan_map-canvas.has-floors .site-plan_block{pointer-events:none;fill-opacity:.06}
.site-plan_map-canvas.has-floors .site-plan_block.is-selected{stroke-width:3}
.site-plan_floor-switch{position:absolute;left:.75rem;top:.75rem;z-index:5;display:inline-flex;gap:.25rem;padding:.25rem;border-radius:999px;background:#fff;box-shadow:0 4px 14px rgba(21,23,20,.15)}
.site-plan_floor-btn{display:inline-flex;align-items:center;gap:.35rem;padding:.35rem .75rem;border:0;border-radius:999px;background:transparent;color:var(--oh-ink);font:inherit;font-size:.8125rem;line-height:1;cursor:pointer;transition:background .15s,color .15s}
.site-plan_floor-btn:hover{background:var(--oh-sand)}
.site-plan_floor-btn.is-active{background:var(--oh-ink);color:#fff}
.site-plan_floor-count{font-size:.6875rem;opacity:.65}
.site-plan_floor-count:empty{display:none}
@media (max-width:767px){.site-plan_floor-switch{left:.5rem;top:.5rem;padding:.2rem}.site-plan_floor-btn{padding:.3rem .55rem}.site-plan_floor-count{display:none}}
/* viewport: the container is a fixed-height box, the stage inside carries half-viewport padding, the canvas an explicit px width (heartland-oh.js) */
.unit-filter_map-container{position:relative;overflow:hidden;height:min(72vh,44rem);background:var(--_colours---backgrounds--white,#fff);border-radius:var(--radius--main,.75rem);cursor:grab;touch-action:none;overscroll-behavior:contain}
.unit-filter_map-container.is-panning{cursor:grabbing}
.site-plan_map{display:block;width:max-content;min-width:100%;overflow:visible}
.site-plan_map-canvas{position:relative;width:1200px;min-width:0;margin:0;aspect-ratio:1690/1490}
.site-plan_map-canvas .site-plan_map-image{display:block;width:100%;height:auto}
.site-plan_zoom{position:absolute;right:.75rem;bottom:.75rem;z-index:5;display:inline-flex;align-items:center;gap:.25rem;padding:.25rem;border-radius:999px;background:#fff;box-shadow:0 4px 14px rgba(21,23,20,.15)}
.site-plan_zoom-btn{display:inline-flex;align-items:center;justify-content:center;width:2rem;height:2rem;border:0;border-radius:999px;background:transparent;color:var(--oh-ink);cursor:pointer}
.site-plan_zoom-btn:disabled{opacity:.35;cursor:default}
.site-plan_zoom-btn svg{width:1.1rem;height:1.1rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.site-plan_zoom-level{min-width:3rem;text-align:center;font-size:.75rem;color:var(--oh-ink)}
.site-plan_tooltip.is-visible{opacity:1}

/* ---- detail panel ---- */
.site-plan_detail-wrap.is-open{visibility:visible;opacity:1;pointer-events:auto;transition:opacity .25s}
.site-plan_detail-wrap.is-open .site-plan_detail-panel{transform:none}
.unit-details_nav-link.is-active{color:var(--oh-ink);border-bottom-color:var(--oh-ink)}
.unit-details_stage .ud-media{display:block;width:100%;height:100%;object-fit:cover}
.ud-playbtn,.ud-expand{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:999px;background:rgba(255,255,255,.92);color:var(--oh-ink);cursor:pointer;box-shadow:0 4px 14px rgba(21,23,20,.18)}
.ud-playbtn{top:50%;left:50%;width:3.5rem;height:3.5rem;transform:translate(-50%,-50%)}
.ud-expand{right:.75rem;bottom:.75rem;width:2.25rem;height:2.25rem}
.ud-playbtn svg,.ud-expand svg{width:45%;height:45%}
.unit-details_thumbnail{position:relative;flex:0 0 4.5rem;height:3.25rem;overflow:hidden;border-radius:.375rem;border:2px solid transparent;cursor:pointer;opacity:.75;transition:opacity .15s,border-color .15s}
.unit-details_thumbnail img,.unit-details_thumbnail video{width:100%;height:100%;object-fit:cover;display:block}
.unit-details_thumbnail.is-current{opacity:1;border-color:var(--oh-ink)}
.unit-details_thumb-badge{position:absolute;right:.25rem;bottom:.25rem;width:1.1rem;height:1.1rem;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.unit-details_thumb-badge svg{width:100%;height:100%}
.unit-details_floorplan-image img,.unit-details_block-image img{display:block;width:100%;height:auto}
html:not(.sales-open) [data-sales-ui]{display:none!important}
html:not(.sales-open) [data-prelaunch-ui]{display:inline-flex}
[data-prelaunch-ui]{display:none}

/* ---- lightboxes (built by heartland-oh.js) ---- */
.ud-lightbox,.fp-lightbox{position:fixed;inset:0;z-index:2147483100;display:none;align-items:center;justify-content:center;background:rgba(21,23,20,.92)}
.ud-lightbox.is-open,.fp-lightbox.is-open{display:flex}
.unit-details_floorplan-image img[src=""],.unit-details_floorplan-image img:not([src]){display:none}
.ud-lightbox_stage{width:min(92vw,1200px);height:min(86vh,800px);display:flex;align-items:center;justify-content:center}
.ud-lightbox_stage img,.ud-lightbox_stage video,.ud-lightbox_stage iframe{max-width:100%;max-height:100%;width:auto;height:auto;border:0}
.ud-lightbox_stage iframe{width:100%;height:100%}
.ud-lb-btn,.fp-lightbox_close{position:absolute;display:flex;align-items:center;justify-content:center;width:2.75rem;height:2.75rem;border:0;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-size:1.5rem;line-height:1;cursor:pointer}
.ud-lb-close,.fp-lightbox_close{top:1rem;right:1rem}
.ud-lb-prev{left:1rem;top:50%;transform:translateY(-50%)}
.ud-lb-next{right:1rem;top:50%;transform:translateY(-50%)}
.ud-lb-counter{position:absolute;bottom:1rem;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.75);font-size:.8125rem}
.fp-zoom{width:min(92vw,1100px);max-height:88vh;overflow:auto;background:#fff;border-radius:.5rem;cursor:zoom-in}
.fp-zoom img{display:block;width:100%;height:auto}
.fp-zoom.is-zoomed{cursor:zoom-out}
.fp-zoom.is-zoomed img{width:auto;max-width:none}
.reservation-status{font-size:.9rem}

/* ---- app shell: no page scroll; sidebar (brand + filters) | plan | list; footer bar ---- */
html.oh-app-pending .page_wrap{visibility:hidden;animation:oh-reveal 0s 3s forwards}
@keyframes oh-reveal{to{visibility:visible}}
html:has(.page_wrap[data-oh-v2]){overflow:hidden;height:100%}
html:has(.page_wrap[data-oh-v2]) body{overflow:hidden;height:100%}
.page_wrap[data-oh-v2]{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
.page_wrap[data-oh-v2] .navbar_component,.page_wrap[data-oh-v2] .section.is-footer,.page_wrap[data-oh-v2] .section.is-unit-selection-v2{display:none}
.page_wrap[data-oh-v2] .page_main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.page_wrap[data-oh-v2] .section.is-site-plan{flex:1 1 auto;min-height:0;padding:0;display:flex;flex-direction:column}
.page_wrap[data-oh-v2] .section.is-site-plan .u-container{max-width:none;width:100%;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.page_wrap[data-oh-v2] .container-padding.is-unit-selector{padding:0;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.unit-filter_component{flex:1 1 auto;min-height:0;display:grid;gap:0;height:auto;background:#fff;align-items:stretch;justify-items:stretch}
.unit-filter_brand{grid-area:brand}
.unit-filter_filters{grid-area:filters}
.unit-filter_main{grid-area:main;min-height:0;display:flex;flex-direction:column;position:relative}
.site-plan_list-wrap{grid-area:list;min-height:0;display:flex;flex-direction:column}
.unit-filter_footer{grid-area:footer}
.unit-filter_map{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;position:relative}
.unit-filter_map-container{flex:1 1 auto;min-height:0;height:auto;border-radius:0;background:var(--oh-sand)}
.site-plan_list-head{flex:none;padding:.9rem 1rem .6rem;border-bottom:1px solid var(--oh-line)}
.site-plan_list{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;padding:1rem;grid-template-columns:1fr;grid-template-rows:none;grid-auto-rows:max-content;align-content:start}
/* filters: the head stays put, only the chips scroll */
.unit-filter_filters{display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:0}
.unit-filter_filters .unit-filter_inner{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
.unit-filter_head{flex:none;padding:.75rem 1.25rem;border-bottom:1px solid var(--oh-line)}
.unit-filter_scroll{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;padding:1rem 1.25rem 1.5rem}
/* colour-by + legend float on the plan */
.unit-filter_map .site-plan_toolbar{position:absolute;top:.75rem;right:.75rem;z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:.5rem;pointer-events:none;max-width:calc(100% - 1.5rem)}
.unit-filter_map .site-plan_toolbar>*{pointer-events:auto}
.unit-filter_map .site-plan_colourby{background:#fff;border-radius:999px;box-shadow:0 4px 14px rgba(21,23,20,.15)}
.unit-filter_map .site-plan_legend{background:rgba(255,255,255,.92);border-radius:.75rem;padding:.45rem .8rem;box-shadow:0 4px 14px rgba(21,23,20,.12);font-size:.8125rem}
@media (min-width:992px){
  /* the brand row is a fixed track: the plan and list span rows 1-2, and an auto track would grow to their content */
  .unit-filter_component{grid-template-columns:16rem minmax(0,1fr) 20rem;grid-template-rows:6.5rem minmax(0,1fr) auto;grid-template-areas:"brand main list" "filters main list" "footer footer footer"}
  .unit-filter_brand{height:6.5rem;overflow:hidden;justify-content:center;padding:0 1.25rem}
  .unit-filter_main,.site-plan_list-wrap{overflow:hidden}
  .unit-filter_brand,.unit-filter_filters{border-right:1px solid var(--oh-line)}
  .site-plan_list-wrap{border-left:1px solid var(--oh-line)}
  .unit-filter_mobile-toolbar,.unit-filter_mobile-map-meta{display:none}
  /* the plan controls are one row across the top of the map: colour-by left, legend right.
     The level switch moves to the bottom left (opposite the zoom pill) to clear it. */
  .unit-filter_map .site-plan_toolbar{left:.75rem;right:.75rem;flex-direction:row;align-items:flex-start;justify-content:space-between;gap:.75rem;max-width:none}
  .site-plan_floor-switch{top:auto;bottom:.75rem}
}
@media (min-width:1280px){.unit-filter_component{grid-template-columns:17rem minmax(0,1fr) 22rem}}
/* ---- detail panel: sticky actions, above the chat widget ---- */
.site-plan_detail-wrap{z-index:2147483000}
.site-plan_detail-panel{display:flex;flex-direction:column}
.unit-details_body{flex:1 1 auto}
.unit-details_actionbar{position:sticky;bottom:0;padding-bottom:calc(.875rem + env(safe-area-inset-bottom,0px))}
.unit-details_actionbar .button{width:100%;justify-content:center}
/* desktop: heartland-oh.js puts [data-actionbar] and the subtabs in one sticky block at the
   top of the panel, so Reserve / Share stay reachable at any scroll depth, above the tabs */
.unit-details_stickyhead{position:sticky;top:0;z-index:6;background:#fff;margin-bottom:1rem;box-shadow:0 10px 12px -10px rgba(21,23,20,.22)}
.unit-details_stickyhead>.unit-details_actionbar{position:static;padding:.25rem 0 .75rem;border-top:0;background:none}
.unit-details_stickyhead .unit-details_scroll-nav{position:static;margin-bottom:0}
.unit-details_stickyhead .unit-details_actionbar-reserve{flex:1 1 auto;min-width:0}
.unit-details_stickyhead .unit-details_actionbar-share{flex:0 0 auto}
.unit-details_stickyhead .unit-details_actionbar-share .button{width:auto}
.unit-details_fp-img[src=""],.unit-details_fp-img:not([src]){display:none}
/* the block: render + level highlight, estate + block highlight */
.unit-details_block-image.has-ud-block>img{display:none}
.ud-block{display:grid;gap:1rem}
.ud-block_fig{margin:0}
.ud-block_stack{position:relative;overflow:hidden;border-radius:.5rem;background:var(--oh-sand)}
.ud-block_base{display:block;width:100%;height:auto}
.ud-block_overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
.ud-block_cap{margin-top:.4rem;font-size:.8125rem;color:var(--_colours---blacks--b-150,#7e7e7d)}
/* tooltip: status as the same pill as the cards */
.site-plan_tooltip .site-plan_pill{display:inline-block;padding:.25rem .625rem;border-radius:999px;font-size:.75rem;line-height:1.5;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--oh-unreleased)}
/* chips: coming soon replaces the count; a fully reserved/sold block reads so */
[data-filter][data-value].is-coming-soon .unit-filter_count,.site-plan_legend-item.is-coming-soon .site-plan_legend-count{display:none}
[data-filter][data-value].is-taken{grid-column:span 2;width:100%;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:.35rem;border-radius:999px;padding:0 .5rem}
[data-filter][data-value].is-taken .unit-filter_count{font-size:.625rem;letter-spacing:.01em;color:var(--oh-sold);white-space:nowrap;margin:0}
[data-filter][data-value].is-coming-soon>span:first-child{white-space:nowrap}
/* coming-soon / reserve popups: unit details left, form right */
/* they are opened from inside the detail panel (z-index 2147483000) - the site's .popup
   z-index of 99999 left them behind it */
#notify-unit-v2.popup,#reserve-unit-v2.popup{z-index:2147483060}
#notify-unit-v2 .modal-content,#reserve-unit-v2 .modal-content{max-width:72rem}
#notify-unit-v2 .contact-2-col-stack,#reserve-unit-v2 .contact-2-col-stack{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:2.5rem 3rem;align-items:start}
#notify-unit-v2 .contact-2-col-stack>.content-cell,#reserve-unit-v2 .contact-2-col-stack>.content-cell{min-width:0}
